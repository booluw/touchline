openapi: 3.1.0
info:
  title: Touchline API
  version: 0.1.0
  description: |
    Touchline is a text-first football management game. The backend is a single
    binary (`cmd/touchline serve` runs the API, the scheduler world clock, and
    the event worker in one process; the api/scheduler/worker subcommands split
    them for prod isolation).

    Authentication is cookie-based: login exchanges credentials for a rotating
    access/refresh cookie pair, and every game endpoint below a security scheme
    marker requires a valid `access_token` cookie. The whole world is scoped to
    the session, so "my world" reads are always the caller's own world.

    Launch model: worlds are created as metadata (name), then an admin declares
    countries and leagues, and finally seeds the whole world with clubs,
    players, and memberships. Seasons/league play follow the fixture system
    driven by the scheduler.

    The interactive reference is this page; the raw spec lives at
    `/openapi.yaml`. Live game state (world ticks, match pace 15-min ticks)
    streams over `/ws` (see the WebSocket section).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development (cmd/touchline serve)
tags:
  - name: health
    description: Liveness probes (OPD-14 — compose healthchecks depend on these).
  - name: auth
    description: Session lifecycle (login + rotation).
  - name: dashboard
    description: Session-gated dashboard aggregate.
  - name: clubs
    description: Club reads + lineup/tactics/training-plan commands (world-scoped to caller).
  - name: finance
    description: Club finances, ledger, contracts (owning manager only).
  - name: transfer
    description: Transfer market listings, bids, and negotiation (world-scoped).
  - name: board
    description: Board confidence, job security snapshot, and mandate negotiation for the caller's club.
  - name: policy
    description: S06-05 delegation policies and absence state for the caller's manager.
  - name: player
    description: Squad morale detail, playing-time promises, and transfer-request approval for the caller's players.
  - name: manager
    description: Manager career surface (offer inbox, resign, and the profile page for any manager in the caller's world).
  - name: admin
    description: World lifecycle, whole-world seeding, country/league administration, offer factory, club-name parts. Admin sessions only.
  - name: competition
    description: Competition manager reads (countries, competitions, fixtures, standings), world-scoped.
  - name: match
    description: Match screen fixture header, persisted match event feed, live tactical changes.
  - name: realtime
    description: Authenticated WebSocket push (world ticks, match updates).
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        "200":
          description: Backend process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                ok:
                  value: { status: ok }
  /health/db:
    get:
      tags: [health]
      summary: Database connectivity probe
      operationId: healthDb
      security: []
      responses:
        "200":
          description: PostgreSQL reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                ok:
                  value: { status: db-ok }
        "503":
          description: PostgreSQL unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                down:
                  value: { status: db-down }
  /ws:
    get:
      tags: [realtime]
      summary: Authenticated WebSocket event stream
      operationId: ws
      description: |
        Upgrades to a WebSocket authenticated by the `access_token` cookie on the
        handshake. The server pushes world-scoped events to every socket of that
        world:

        * `world_tick` — `{ event_id, granularity: "daily"|"weekly"|"monthly", tick }`
          broadcast when the scheduler advances the caller's world.
        * `match_update` — live match state updates (`minute`, running score) as the
          worker simulates in-progress matches.

        A HTTP-only cookie is not accessible to the browser WebSocket client
        constructor; Nuxt forwards it automatically because the socket is opened
        same-site. Failing auth closes the handshake with 401.
      security:
        - sessionCookie: []
      responses:
        "101":
          description: WebSocket upgrade accepted; stream begins.
        "401":
          description: Missing/invalid access_token cookie.
  /api/auth/login:
    post:
      tags: [auth]
      summary: Establish a session
      operationId: login
      security: []
      description: |
        Validates credentials and opens a session. An administrator always gets a
        world-less console session. Any other account is resolved per OPD-15(4):

        - the account's active job world wins when it holds one;
        - a jobless account may pass `world_id` to pick a world explicitly (403 if
          it is not a member there);
        - with exactly one joined world the session is minted for that world;
        - with several joined worlds the response is a world PICKER
          `{"status":"worlds","worlds":[...]}` — no cookies are set and the client
          re-posts with the chosen `world_id`;
        - an account with no joined world gets 403 (ErrNoManager).

        The world resolution operates on non-archived memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@touchline.local }
                password: { type: string, format: password, example: changeme }
                world_id:
                  type: string
                  format: uuid
                  description: Explicit world pick for a jobless multi-world account (OPD-15(4)(b)).
                  example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: |
            Either a session (cookies set, `display_name` body) or the world
            picker (`{"status":"worlds","worlds":[...]}`, no cookies).
          headers:
            Set-Cookie:
              description: access_token + refresh_token httpOnly cookies (session outcome only).
              schema: { type: string, example: "access_token=eyJ...; HttpOnly; Path=/; SameSite=Lax; Max-Age=900" }
          content:
            application/json:
              schema:
                oneOf:
                  - title: session
                    type: object
                    properties:
                      display_name: { type: string, example: "Alan Coach" }
                      created_at: { type: string, format: date-time }
                      is_admin: { type: boolean, example: false }
                      id: { type: string, format: uuid }
                      club:
                        description: "The manager's current club, or null when the account is unemployed or an admin."
                        allOf: [{ $ref: "#/components/schemas/ClubRef" }]
                        nullable: true
                  - title: worldPicker
                    type: object
                    required: [status, worlds]
                    properties:
                      status: { type: string, example: worlds }
                      worlds:
                        type: array
                        items: { $ref: "#/components/schemas/WorldChoice" }
        "400":
          description: Malformed body (missing email/password).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "email and password are required" }
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "invalid email or password" }
        "403":
          description: Account is not loggable into any world (ErrNoManager / ErrNotMember).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noWorld:
                  value: { error: "no world joined — an administrator must give this account a world before it can log in" }
                notMember:
                  value: { error: "this account is not a member of the requested world" }
  /api/auth/register:
    post:
      tags: [auth]
      summary: Create a manager account (signup)
      operationId: register
      security: []
      description: |
        Product signup flow (A13). Creates a plain (non-admin) account and — when
        there is EXACTLY one playable world (`active`/`open_beta`) — auto-joins it
        as an unemployed manager and auto-issues a first job offer from the first
        available AI club (deterministic by club id). With zero or several
        playable worlds the account is created world-less (`world: null`) and an
        administrator must join it later. Auto-offer is best-effort: when no AI
        club is available the account is created and `offer` is null. No session
        is minted by registration; the new manager logs in via /api/auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: player@touchline.local }
                password: { type: string, format: password, example: changeme }
                display_name:
                  type: string
                  description: Defaults to the email local part.
                  example: Alan Coach
      responses:
        "201":
          description: Account created (and joined + offered when possible).
          content:
            application/json:
              schema:
                type: object
                required: [id, email, display_name, is_admin, world, offer]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  display_name: { type: string }
                  is_admin: { type: boolean, enum: [false] }
                  world:
                    description: The joined world, or null when no auto-join happened.
                    allOf:
                      - $ref: "#/components/schemas/WorldChoice"
                      - nullable: true
                  offer:
                    description: The auto-issued first job offer, or null.
                    $ref: "#/components/schemas/JobOffer"
              examples:
                joined:
                  value:
                    id: 00000000-0000-4000-8000-000000000100
                    email: player@touchline.local
                    display_name: Alan Coach
                    is_admin: false
                    world:
                      world_id: 00000000-0000-4000-8000-000000000001
                      name: Westland
                      status: active
                    offer:
                      id: 00000000-0000-4000-8000-000000000009
                      world_id: 00000000-0000-4000-8000-000000000001
                      club_id: 00000000-0000-4000-8000-000000000005
                      club_name: Northgate Rovers
                      manager_id: 00000000-0000-4000-8000-000000000101
                      status: proposed
                      created_at: "2026-01-01T00:00:00Z"
                worldless:
                  value:
                    id: 00000000-0000-4000-8000-000000000100
                    email: player@touchline.local
                    display_name: Alan Coach
                    is_admin: false
                    world: null
                    offer: null
        "400":
          description: Malformed body (missing email/password).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "email and password are required" }
        "409":
          description: An account with this email already exists (ErrEmailTaken).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "an account with this email already exists" }
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the session
      operationId: refresh
      security: []
      description: |
        Exchanges the `refresh_token` cookie for a fresh cookie pair for the same
        manager. Used when the access token expires.
      responses:
        "200":
          description: Session rotated; new cookie pair set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
                  club:
                    description: "The manager's current club, or null when the account is unemployed or an admin."
                    allOf: [{ $ref: "#/components/schemas/ClubRef" }]
                    nullable: true
              example: { status: ok, club: null }
        "401":
          description: Missing/invalid refresh token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing refresh token" }
  /api/dashboard:
    get:
      tags: [dashboard]
      summary: Home dashboard aggregate (S07-01)
      operationId: dashboard
      description: |
        The manager's home feed: urgent, important and interesting items
        aggregated from the world's already-persisted state (open bid threads,
        expiring contracts, imminent fixtures, board confidence, finances,
        player morale, table position, rival results, market news). Postgres is
        authoritative; the same items are pushed incrementally over the socket
        as `dashboard_update` events. A manager with no active club gets empty
        sections rather than an error.
      responses:
        "200":
          description: Aggregated dashboard feed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSnapshot" }
        "401":
          description: No valid access_token cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unauthorized" }
        "403":
          description: The caller has no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "no world context" }
  /api/news:
    get:
      tags: [dashboard]
      summary: Manager news feed
      operationId: newsFeed
      description: |
        The world's published news stories, newest first, scoped to the
        calling manager's world (resolved from the session identity).
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum items returned, capped at 100.
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: The manager's world news feed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  world_id: { type: string, format: uuid }
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/NewsStory" }
        "401":
          description: No valid access_token cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unauthorized" }
        "403":
          description: The caller has no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "no world context" }
  /api/clubs:
    get:
      tags: [clubs]
      summary: List clubs in my world
      operationId: listClubs
      description: Clubs of the caller's own world (AI clubs included).
      responses:
        "200":
          description: Club list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clubs:
                    type: array
                    items: { $ref: "#/components/schemas/Club" }
              examples:
                sample:
                  value:
                    clubs:
                      - id: 00000000-0000-4000-8000-000000000005
                        world_id: 00000000-0000-4000-8000-000000000001
                        name: Northgate Rovers
                        short_name: NGR
        "403":
          description: Session has no world context (admin console session).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "no world context" }
  /api/clubs/{id}:
    get:
      tags: [clubs]
      summary: Get a club in my world
      operationId: getClub
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Club detail with full squad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubDetail" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000005
                    world_id: 00000000-0000-4000-8000-000000000001
                    name: Northgate Rovers
                    short_name: NGR
                    country: England
                    is_ai_controlled: false
                    manager:
                      id: 00000000-0000-4000-8000-000000000006
                      display_name: Test Manager
                    squad:
                      - id: 00000000-0000-4000-8000-00000000000b
                        person_id: 00000000-0000-4000-8000-00000000000c
                        first_name: Leo
                        last_name: Marsh
                        display_name: Leo Marsh
                        nationality_code: ENG
                        nationality_name: England
                        date_of_birth: "1998-04-12T00:00:00Z"
                        age: 27
                        primary_position: ST
                        squad_number: 9
        "400":
          description: Invalid club id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "invalid club id" }
        "403":
          description: No world context on the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "club not found" }
  /api/clubs/{id}/fixtures:
    get:
      tags: [clubs]
      summary: Club fixture list
      operationId: getClubFixtures
      description: |
        One club's fixtures ordered by kickoff time, earliest first. World-scoped
        exactly like the other club reads (IM03): fixtures only ever belong to
        the caller's own world.
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The club's fixture list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Fixture" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000007
                      world_id: 00000000-0000-4000-8000-000000000001
                      competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                      home_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                      away_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                      matchday: 1
                      scheduled_at: "2026-06-02T15:00:00Z"
                      status: scheduled
                    - id: 00000000-0000-4000-8000-000000000008
                      world_id: 00000000-0000-4000-8000-000000000001
                      competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                      home_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                      away_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                      matchday: 2
                      scheduled_at: "2026-06-04T18:00:00Z"
                      status: scheduled
        "404":
          description: Club not found, or not in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/next-fixture:
    get:
      tags: [clubs]
      summary: Next fixture with opponent scout report
      operationId: getNextClubFixture
      description: |
        The club's earliest upcoming fixture across all its competitions (by
        real-world kickoff, in fixture.scheduled_at), its gameweek, and a scout
        report on the opponent. World-scoped like the other club reads. A club
        with no upcoming fixture (off-season) returns a 200 with a null payload.
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The next fixture and opponent dossier, or null when off-season.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_fixture: { $ref: "#/components/schemas/NextFixtureView", nullable: true }
              examples:
                sample:
                  value:
                    next_fixture:
                      fixture:
                        id: 00000000-0000-4000-8000-000000000013
                        world_id: 00000000-0000-4000-8000-000000000001
                        competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                        home_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                        away_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                        matchday: 4
                        gameweek: 4
                        scheduled_at: "2026-06-11T15:00:00Z"
                        status: scheduled
                      gameweek: 4
                      home_or_away: home
                      derby: false
                      golden_goal: false
                      opponent:
                        club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                        country: { id: 00000000-0000-4000-8000-00000000000c, name: England, code: ENG }
                        is_ai_controlled: true
                        manager: { id: 00000000-0000-4000-8000-00000000000f, is_policy_bot: true }
                        reputation: 15
                        tier: 2
                        league_position: 2
                        form: { form_string: "W-D-L-W", current_rating: 1.04 }
                        squad_count: 22
                        top_players:
                          - id: 00000000-0000-4000-8000-000000000020
                            person_id: 00000000-0000-4000-8000-000000000022
                            first_name: Marcus
                            last_name: Webb
                            display_name: Marcus Webb
                            primary_position: ST
                            rating: 82
        "404":
          description: Club not found, or not in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/lineup:
    get:
      tags: [clubs]
      summary: Get the club's lineup
      operationId: getLineup
      description: Slot -> player mapping (16 slots; empty slots null).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The current lineup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineup" }
              examples:
                sample:
                  value:
                    slots:
                      - slot: 0
                        position: GK
                        player:
                          id: 00000000-0000-4000-8000-00000000000b
                          name: Jordan Ashworth
    put:
      tags: [clubs]
      summary: Set the club's lineup
      operationId: setLineup
      description: Submit a full 16-slot lineup. Requires the club's manager identity (or an AI policy bot in scheduled mode).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  minItems: 16
                  maxItems: 16
                  items:
                    type: object
                    required: [slot]
                    properties:
                      slot: { type: integer, example: 0 }
                      player_id: { type: string, format: uuid, nullable: true, example: "00000000-0000-4000-8000-00000000000b" }
      responses:
        "204":
          description: Lineup saved.
        "400":
          description: Invalid lineup (players not in squad, duplicated, wrong count).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthenticated.
        "403":
          description: Not the owning manager of the club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/tactics:
    get:
      tags: [clubs]
      summary: Get the club's tactics
      operationId: getTactics
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Style, formation, allowed formations, and current slot assignments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tactics" }
              examples:
                sample:
                  value:
                    club_id: 00000000-0000-4000-8000-000000000005
                    style: balanced
                    formation: 4-3-3
                    allowed_formations: ["4-3-3", "4-4-2", "3-5-2"]
                    slots:
                      - slot: 0
                        position: GK
                        player_id: 00000000-0000-4000-8000-00000000000b
    post:
      tags: [clubs]
      summary: Set the club's tactics
      operationId: setTactics
      description: Change playing style and/or formation (effect on the existing slot mapping is a bulk re-check by the service).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style, formation]
              properties:
                style: { type: string, enum: [balanced, counter, attacking, defensive, press, possession], example: balanced }
                formation: { type: string, example: "4-3-3" }
      responses:
        "204":
          description: Tactics saved.
        "400":
          description: Invalid formation/style for the squad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/training-plan:
    get:
      tags: [clubs]
      summary: Get the club's training plan
      operationId: getTrainingPlan
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The club's weekly training archetype.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPlan" }
              examples:
                sample:
                  value:
                    club_id: 00000000-0000-4000-8000-000000000005
                    archetype: balanced
                    effective_from_tick: 62
                    last_applied_week: 7
    post:
      tags: [clubs]
      summary: Set the club's training plan
      operationId: setTrainingPlan
      parameters:
        - $ref: "#/components/parameters/ClubID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archetype]
              properties:
                archetype:
                  type: string
                  enum: [balanced, attacking, defending, fitness, technical]
                  example: balanced
      responses:
        "204":
          description: Training plan saved.
        "400":
          description: Unknown archetype.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/academy:
    get:
      tags: [clubs]
      summary: Get the club's academy configuration
      operationId: getAcademy
