                        members:
                          - 00000000-0000-4000-8000-00000000000a
                          - 00000000-0000-4000-8000-00000000000b
                        cohesion: 61
                        explanation: { subject: faction_cohesion, score: 61, factors: [{ label: members, delta: 2 }] }
                    unrest:
                      severity: 68
                      demand: board_meeting
                      affected: [00000000-0000-4000-8000-00000000000b]
                    explanation: { subject: squad_dynamics, score: 1, factors: [{ label: squad members, delta: 24 }] }
        "403":
