        avg_overall: { type: integer }
        avg_potential: { type: integer }
    NationalityMix:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        count: { type: integer }
    IntakeRow:
      type: object
      properties:
        season_number: { type: integer }
        player_count: { type: integer }
    CountryPlayerSummary:
      type: object
      properties:
        country: { $ref: "#/components/schemas/CountryRef" }
        total: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        by_origin:
          type: object
          additionalProperties: { type: integer }
        by_position:
          type: array
          items: { $ref: "#/components/schemas/PositionBreakdown" }
        nationalities:
          type: array
          items: { $ref: "#/components/schemas/NationalityMix" }
        intakes:
          type: array
          items: { $ref: "#/components/schemas/IntakeRow" }
        avg_age: { type: number, format: float }
    AdminFreeAgentList:
      type: object
      properties:
        country_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/FreeAgent" }
        total: { type: integer }
    ListingRow:
      type: object
      properties:
        listing_id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        position: { type: string }
        listing_club: { $ref: "#/components/schemas/NestedClub" }
        asking_price: { type: integer, format: int64, nullable: true }
        market_value: { type: integer, format: int64 }
        listing_type: { type: string, enum: [open_to_offers, actively_shopped, loan_available] }
        listed_at: { type: string, format: date-time }
    BidRow:
      type: object
      properties:
        bid_id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        bidding_club: { $ref: "#/components/schemas/NestedClub" }
        selling_club: { $ref: "#/components/schemas/NestedClub" }
        fee: { type: integer, format: int64 }
        status: { type: string, enum: [pending, countered] }
        created_at: { type: string, format: date-time }
    TransferRow:
      type: object
      properties:
        transfer_id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        from_club: { $ref: "#/components/schemas/NestedClub" }
        to_club: { $ref: "#/components/schemas/NestedClub" }
        fee: { type: integer, format: int64 }
        market_value: { type: integer, format: int64 }
        overpay: { type: boolean }
        overpay_pct: { type: integer, nullable: true }
        completed_at: { type: string, format: date-time }
    CountryMarketPanel:
      type: object
      properties:
        country: { $ref: "#/components/schemas/CountryRef" }
        window_days: { type: integer }
        open_listings:
          type: array
          items: { $ref: "#/components/schemas/ListingRow" }
        bids_received:
          type: array
          items: { $ref: "#/components/schemas/BidRow" }
        bids_made:
          type: array
          items: { $ref: "#/components/schemas/BidRow" }
        transfers_in:
          type: array
          items: { $ref: "#/components/schemas/TransferRow" }
        transfers_out:
          type: array
          items: { $ref: "#/components/schemas/TransferRow" }
        signings:
          type: array
          items: { $ref: "#/components/schemas/TransferRow" }
    CrisisClubRow:
      type: object
      properties:
        club_id: { type: string, format: uuid }
        club_name: { type: string }
        stage:
          type: string
          enum: [warning, restriction, emergency, administration_risk, ownership_intervention, bankruptcy]
        started_at: { type: string, format: date-time }
    WageRow:
      type: object
      properties:
        club_id: { type: string, format: uuid }
        club_name: { type: string }
        weekly_wage_bill: { type: integer, format: int64 }
        active_commitments: { type: integer }
    BudgetSide:
      type: object
      properties:
        allocated: { type: integer, format: int64 }
        committed: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        utilized_pct: { type: integer }
    CountryFinancePanel:
      type: object
      properties:
        country: { $ref: "#/components/schemas/CountryRef" }
        crisis_clubs:
          type: array
          items: { $ref: "#/components/schemas/CrisisClubRow" }
        wage_bill: { type: integer, format: int64 }
        top_wage_bills:
          type: array
          items: { $ref: "#/components/schemas/WageRow" }
        wage_budget: { $ref: "#/components/schemas/BudgetSide" }
        transfer_budget: { $ref: "#/components/schemas/BudgetSide" }
        cash: { type: integer, format: int64 }
    TimelineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, nullable: true }
        title: { type: string }
        payload:
          type: object
          additionalProperties: true
    CountryTimeline:
      type: object
      properties:
        country: { $ref: "#/components/schemas/CountryRef" }
        since: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
    AdminRenameClubRequest:
      type: object
      required: [name, news]
      properties:
        name: { type: string, description: The new club name, unique in the world. }
        short_name:
          type: string
          description: Optional 3-letter abbreviation; derived when omitted.
        news:
          type: object
          required: [headline, body]
          properties:
            headline: { type: string }
            body: { type: string }
      additionalProperties: false
    AdminRenameClubResult:
      type: object
      properties:
        club_id: { type: string, format: uuid }
        old_name: { type: string }
        new_name: { type: string }
        short_name: { type: string }
        news_story_id: { type: string, format: uuid }
    NewsStory:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        headline: { type: string }
        body: { type: string }
        category: { type: string }
        related_event_id: { type: string, format: uuid }
        published_at: { type: string, format: date-time }
