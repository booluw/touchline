    ClubRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        short_name: { type: string }
        is_ai_controlled: { type: boolean }
        tier: { type: integer }
        league:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/NestedLeague" }]
        league_tier: { type: integer }
        squad_size: { type: integer }
        top_player_name: { type: string }
        top_player_market_value: { type: integer, format: int64 }
        wage_bill: { type: integer, format: int64 }
        wage_allocated: { type: integer, format: int64 }
        wage_committed: { type: integer, format: int64 }
        transfer_allocated: { type: integer, format: int64 }
        transfer_committed: { type: integer, format: int64 }
        crisis_stage: { type: string, nullable: true }
        cash: { type: integer, format: int64 }
    CountryClubsPanel:
      type: object
      properties:
        country: { $ref: "#/components/schemas/CountryRef" }
        clubs:
          type: array
          items: { $ref: "#/components/schemas/ClubRow" }
    PositionBreakdown:
      type: object
      properties:
        position: { type: string, example: ST }
