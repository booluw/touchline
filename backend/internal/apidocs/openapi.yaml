        "200":
          description: The academy configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Academy" }
              examples:
                sample:
                  value:
                    club_id: 00000000-0000-4000-8000-000000000005
                    world_id: 00000000-0000-4000-8000-000000000001
                    is_active: true
                    investment_tier: 3
                    tier_name: Premier Prospects
                    facility_level: 4
                    scouting_level: 2
                    staff_quality: 3
                    annual_cost: 1200000
                    upgrade_cost: 2000000
                    youth_intake_targets: 16
                    season_start_intake_season: 3
        "403":
          description: Not the owning manager.
          content:
            application/json:
