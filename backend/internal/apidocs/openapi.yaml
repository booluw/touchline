          description: The updated academy configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Academy" }
        "400":
          description: Invalid tier or empty body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/medical-facility:
    get:
      tags: [clubs]
      summary: Get the club's medical facility
      operationId: getMedicalFacility
      description: Owning manager only. Returns the medical-staff level 1..10 that shortens injury recovery and lowers recurrence risk; a club that never built a facility reads as the neutral level 5 (S08-03). No row is written on read.
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The medical facility.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalFacility" }
              examples:
                sample:
                  value:
                    club_id: 00000000-0000-4000-8000-000000000005
                    level: 6
                    upgraded_at: "2026-03-02T09:15:00Z"
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [clubs]
      summary: Upgrade the club's medical facility one level
      operationId: upgradeMedicalFacility
      description: Owning manager only. The step is debited from the club account (cumulative £200k × step), materialising the medical row at the neutral level on first use, and MEDICAL_FACILITY_UPGRADED broadcasts the change. At level 10 the current facility is returned unchanged.
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The upgraded medical facility.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalFacility" }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
