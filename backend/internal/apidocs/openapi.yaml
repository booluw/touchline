      tags: [manager]
      summary: Resign from my club
      operationId: resign
      description: |
        The manager vacates their club (back to AI control). Any open offers
        remain; the manager is once again hirable.
      responses:
        "200":
          description: Resignation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "409":
          description: No club to resign from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/{id}/profile:
    get:
      tags: [manager]
      summary: Manager profile page
      operationId: getManagerProfile
      description: |
        Full profile for any manager in the caller's world: career stats, active
        club, trophy cabinet, head-to-head record against the viewer's club, on-the-fly trust
        score, and the relationship edges (rivalries) attached to the manager and
        their active club. Cross-world and unknown managers are 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The assembled profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerProfile" }
        "404":
          description: Manager not found or not in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/messages:
    get:
      tags: [manager]
      summary: Direct-message inbox
      operationId: listMessages
      description: |
        The caller's inbound direct messages (newest first, capped at 100) plus
        the unread count. World-scoped to the caller's manager; sender display
        names are resolved from person records.
      responses:
        "200":
          description: The inbox page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessages" }
    post:
      tags: [manager]
      summary: Send a direct message
      operationId: sendMessage
      description: |
        Delivers one manager→manager direct message. The body is sanitized
        server-side (HTML tags stripped, whitespace trimmed, max 2000
        characters); recipients must be human managers in the caller's world.
        Rate limits: 30 messages per minute and 200 per day per sender.
        Also publishes a MESSAGE_SENT world event and a best-effort
        social_message realtime push to the recipient's world.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            example:
              recipient_id: 00000000-0000-4000-8000-000000000006
              body: Good luck this weekend, rival.
      responses:
        "201":
          description: The persisted message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Missing/invalid recipient or body, self-message, or a policy-bot recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Recipient not found or not in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Message body exceeds 2000 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Sender over the per-minute or per-day limit.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the limiter resets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/messages/{id}/read:
    post:
      tags: [manager]
      summary: Mark a direct message read
      operationId: markMessageRead
      description: |
        Idempotently stamps read_at on one of the caller's inbound messages and
        returns the updated row. Messages that are not the caller's read as 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The message id.
      responses:
        "200":
          description: The updated message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404":
          description: Message not found or addressed to someone else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/relationships:
    get:
      tags: [manager]
      summary: Relationship graph
      operationId: listRelationships
      description: |
        Every rivalry edge attached to the caller: their personal
        manager↔manager edges plus the club↔club edges of their active club
        (S06-04c). Edges are auto-tracked from completed fixtures and decay
        over long gaps. Trust is the on-the-fly SUM of the caller's
        trust_events (match wins/losses); rivalry reads are authoritative —
        the relationship_change realtime push is best-effort.
      responses:
        "200":
          description: The caller's rivalry edges.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relationships" }
              example:
                world_id: 00000000-0000-4000-8000-000000000001
                edges:
                  - relationship_type: rivalry
                    entity_type: club
                    entity_id: 00000000-0000-4000-8000-000000000014
                    entity_name: Highfield United
                    strength: 28
                    trust: 0
                    sentiment: 0
        "404":
          description: Caller's manager row unknown (world boundary).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/offers/{id}/accept:
    post:
      tags: [manager]
      summary: Accept a job offer
      operationId: acceptOffer
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "200":
          description: The accepted offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOffer" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000009
                    world_id: 00000000-0000-4000-8000-000000000001
                    club_id: 00000000-0000-4000-8000-000000000014
                    club_name: Highfield United
                    manager_id: 00000000-0000-4000-8000-000000000006
                    status: accepted
                    created_at: "2026-06-01T19:00:00Z"
        "404":
          description: Offer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Offer already decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/offers/{id}/decline:
    post:
      tags: [manager]
      summary: Decline a job offer
      operationId: declineOffer
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "200":
          description: The declined offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOffer" }
        "404":
          description: Offer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Offer already decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/countries/{countryID}/clubs/{clubID}:
    patch:
      tags: [admin]
      summary: Rename a country club
      operationId: adminRenameClub
      description: |
        Renames one of the country's clubs and publishes an admin-authored news
        story announcing it. The change, the CLUB_RENAMED event and the news
        story commit together — a rename is never a silent change.
      parameters:
        - $ref: "#/components/parameters/WorldID"
        - $ref: "#/components/parameters/AdminCountryID"
        - name: clubID
          in: path
          required: true
          description: The club to rename.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRenameClubRequest" }
      responses:
        "200":
          description: The materialized rename.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRenameClubResult" }
        "400":
          description: Invalid body or ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: World, country or club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Another club in this world already uses that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/news:
    get:
      tags: [admin]
      summary: World news stories
      operationId: adminWorldNews
      description: The world's published news stories, newest first.
      parameters:
        - $ref: "#/components/parameters/WorldID"
        - name: limit
          in: query
          required: false
          description: Maximum items returned, capped at 100.
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: The world's news stories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  world_id: { type: string, format: uuid }
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/NewsStory" }
        "403":
          description: Not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds:
    get:
      tags: [admin]
      summary: List worlds
      operationId: listWorlds
      description: Lists every world row (lifecycle metadata only).
      responses:
        "200":
          description: The worlds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/World" }
    post:
      tags: [admin]
      summary: Create a world
      operationId: createWorld
      description: |
        Registers a new world in a provisioning state. A world is then built by
        declaring countries/leagues and seeding (no playable season exists
        until the start-season service runs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Test League World" }
      responses:
        "201":
          description: The created world row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/World" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000001
                    name: Test League World
                    status: provisioning
                    created_at: "2026-06-01T19:00:00Z"
        "409":
          description: A world with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/status:
    post:
      tags: [admin]
      summary: Transition a world's lifecycle status
      operationId: setWorldStatus
      parameters:
        - $ref: "#/components/parameters/WorldID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [provisioning, seeding, active, paused, archived]
                  example: seeding
      responses:
        "200":
          description: Updated world row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/World" }
        "400":
          description: Unknown status / invalid transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/config:
    post:
      tags: [admin]
      summary: Write a world config key
      operationId: setWorldConfig
      parameters:
        - $ref: "#/components/parameters/WorldID"
      description: |
        Sets one world_config key. The clock-side keys since IM02:
        `tick.daily_cadence` (the only granularity that advances the day counter;
        default `0 0 * * *`) and `tick.match_cadence` (seeded, paces live
        matches, ignored by the world clock — OPD-17(2)). The week/month
        boundaries come from `calendar.days_per_week` / `calendar.days_per_month`
        (JSON numbers, default 7 / 30). Legacy `tick.hourly_cadence`,
        `tick.weekly_cadence`, `tick.monthly_cadence`, `tick.seasonal_cadence`
        keys are retired. Re-read every `SCHEDULER_POLL_INTERVAL`,
        so a change takes effect without a redeploy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: tick.daily_cadence
                value:
                  type: string
                  description: 5-field cron spec.
                  example: "30 0 * * *"
      responses:
        "200":
          description: Config written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "400":
          description: Missing key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/seed:
    post:
      tags: [admin]
      summary: Queue a whole-world seed
      operationId: seedWorld
      description: |
        Queues the whole-world seed as an async job on the "seed" queue and
        returns immediately. Every league is filled to its team_count with AI
        clubs, squads are drafted from each country's free-agent pool, and pool
        memberships are recorded. Idempotent and incremental: leagues already at
        team_count are skipped, so re-running only fills what's missing. The
        first successful run mints the world's replay random seed. Requires
        countries+leagues to be declared first. Duplicate submissions for the
        same world coalesce while one is pending or running (jobs are unique by
        args).
        Poll `GET /api/admin/worlds/{id}/seed-status` for progress and the
        result.
      parameters:
        - $ref: "#/components/parameters/WorldID"
      responses:
        "202":
          description: Seed job queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: queued }
                  world_id: { type: string, format: uuid }
                  job_id: { type: integer, format: int64 }
              examples:
                sample:
                  value:
                    status: queued
                    world_id: 00000000-0000-4000-8000-000000000001
                    job_id: 42
        "422":
          description: World is archived or has no leagues to seed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "world has no leagues" }
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/seed-status:
    get:
      tags: [admin]
      summary: World seed status
      operationId: seedWorldStatus
      description: |
        Reports the async seed job's state (from the river job queue) together
        with the world's actual seeding progress: whether the replay seed has
        been minted, how many leagues are full, club count, and the country
        free-agent pool size. `job` is null until a seed has been requested;
        failed job attempts surface in `job.last_error`.
      parameters:
        - $ref: "#/components/parameters/WorldID"
      responses:
        "200":
          description: Seed progress and latest job state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSeedStatus" }
              examples:
                sample:
                  value:
                    world_id: 00000000-0000-4000-8000-000000000001
                    world_seeded: false
                    leagues: { total: 2, seeded: 0 }
                    clubs: 0
                    pool_size: 0
                    job:
                      id: 42
                      state: running
                      attempt: 1
                      max_attempts: 5
                      attempted_at: 2026-01-01T12:00:00Z
                      finished_at: null
                      last_error: null
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/leagues/{leagueID}/season:
    post:
      tags: [admin]
      summary: Start a league's first season
      operationId: startSeason
      description: |
        Starts the first season of a league from its seeded member clubs:
        creates the season row, its competition_entries, and the deterministic
        double round-robin fixture list. Requires the world to be seeded for
        that league first (clubs present). The first season is created
        `in_progress`; later seasons are created automatically by the season
        rollover, after the admin-tunable off-season gap
        (`season.off_season_ticks` world config, or a per-league override in
        `competition_rules.scheduling_rules`).
      parameters:
        - $ref: "#/components/parameters/WorldID"
        - name: leagueID
          in: path
          required: true
          description: League id.
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000a" }
      responses:
        "201":
          description: The started season (status in_progress).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Season" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000011
                    competition:
                      id: 00000000-0000-4000-8000-00000000000a
                      name: Premier
                    season_label: 2031/32
                    season_number: 1
                    status: in_progress
        "404":
          description: World or league not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            League already has a season, is not seeded, or does not belong to
            this world; the world is archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/countries:
    get:
      tags: [admin]
      summary: List declared countries
      operationId: listCountries
      responses:
        "200":
          description: Country list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Country" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000002
                      code: ENG
                      name: England
    post:
      tags: [admin]
      summary: Declare a country for the world
      operationId: createCountry
      description: Metadata only — a country holds tiers of leagues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [world_id, code, name]
              properties:
                world_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000001" }
                code: { type: string, example: ENG }
                name: { type: string, example: England }
      responses:
        "201":
          description: The created country.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Country" }
        "400":
          description: Missing fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/leagues:
    get:
      tags: [admin]
      summary: List declared leagues
      operationId: listLeagues
      responses:
        "200":
          description: League list across all declared countries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/League" }
    post:
      tags: [admin]
      summary: Declare a league
      operationId: createLeague
      description: Metadata only — tiers and promotion/relegation rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_id, name, team_count]
              properties:
                country_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000002" }
                name: { type: string, example: "Premier League" }
                tier: { type: integer, minimum: 1, example: 1 }
                team_count: { type: integer, minimum: 4, example: 20 }
                promotions: { type: integer, example: 3 }
                relegations: { type: integer, example: 3 }
                promotes_to: { type: string, format: uuid, nullable: true }
                relegates_to: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: The created league.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/League" }
        "400":
          description: Malformed payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/leagues/{id}/adjacency:
    patch:
      tags: [admin]
      summary: Update a league's promotion/relegation links
      operationId: updateAdjacency
      parameters:
        - $ref: "#/components/parameters/LeagueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promotes_to: { type: string, format: uuid, nullable: true, description: League promoted into above this one. }
                relegates_to: { type: string, format: uuid, nullable: true, description: League relegated into below this one. }
      responses:
        "200":
          description: Updated league.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/League" }
        "400":
          description: Cycles or cross-country adjacency rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: League not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/leagues/{id}/scheduling:
    patch:
      tags: [admin]
      summary: Set a league's allowed scheduling weekdays (IM05)
      operationId: updateLeagueScheduling
      description: |
        Persists the league's allowed_weekdays override and re-paces its
        calendar: matchdays with a live/completed fixture are frozen and every
        unstarted matchday slides forward onto the earliest allowed weekday at
        least two game-days clear, keeping matchday order and the kickoff-hour
        rotation. An empty array clears the override (restoring the country/
        legacy fallback) without moving fixtures. Publish a country-scoped
        'scheduling' news story when fixtures move.
      parameters:
        - $ref: "#/components/parameters/LeagueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed_weekdays]
              properties:
                allowed_weekdays:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 7, example: 3 }
                  description: "ISO weekdays the league may play on (1=Mon..7=Sun). Empty clears the override."
      responses:
        "200":
          description: The re-pacing result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendar_updated: { type: boolean, example: true }
                  matchdays_re_paced: { type: integer, example: 4 }
                  fixtures_moved: { type: integer, example: 12 }
        "400":
          description: Malformed payload or competition is not a league.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: League not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/cups/{id}/scheduling:
    patch:
      tags: [admin]
      summary: Set a cup's allowed scheduling weekdays (IM05)
      operationId: updateCupScheduling
      description: |
        Persists the cup's allowed_weekdays override. The cup's existing round
        dates stand until the next round is materialized; the anchored
        backward walk (planCupCalendar) honors the weekday set from the next
        campaign onward.
      parameters:
        - $ref: "#/components/parameters/CupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed_weekdays]
              properties:
                allowed_weekdays:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 7, example: 3 }
                  description: "ISO weekdays the cup may play on (1=Mon..7=Sun). Empty clears the override."
      responses:
        "200":
          description: The persisted override (cup dates stand unchanged).
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendar_updated: { type: boolean, example: true }
        "400":
          description: Malformed payload or competition is not a domestic cup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Cup not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/countries/{countryID}/scheduling:
    patch:
      tags: [admin]
      summary: Set a country's default scheduling weekdays (IM05)
      operationId: updateCountryScheduling
      description: |
        Persists the country's default_scheduling_rules allowed_weekdays set
        and re-paces every one of its leagues that has no override of its own,
        so a country-wide rule change propagates to the whole calendar in one
        shot. Start-of-season materialization falls back per-competition →
        country default → legacy day-formula pacing. Clearing the default
        (empty array) persists the rules without moving fixtures; a country-scoped
        'scheduling' news story is published on any league whose calendar moves.
      parameters:
        - $ref: "#/components/parameters/WorldID"
        - name: countryID
          in: path
          required: true
          description: Country owning the calendar.
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000002" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed_weekdays]
              properties:
                allowed_weekdays:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 7, example: 3 }
                  description: "ISO weekdays leagues in this country default to (1=Mon..7=Sun). Empty clears the default."
      responses:
        "200":
          description: The re-pacing result across affected leagues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendar_updated: { type: boolean, example: true }
                  matchdays_re_paced: { type: integer, example: 7 }
                  fixtures_moved: { type: integer, example: 21 }
        "400":
          description: Malformed payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Country not found in world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/cups:
    post:
      tags: [admin]
      summary: Declare a domestic cup
      operationId: createCup
      description: |
        Declares a knockout domestic cup under a world's country. Metadata plus
        staged eligibility (IM04): N top tier-1 clubs (first_tier_bye) sit out
        the qualifiers and join when X (survivor_threshold) lower clubs remain;
        golden goal decides drawn ties. The bracket is drawn lazily round by
        round from a persisted plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [world_id, country_id, name]
              properties:
                world_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000001" }
                country_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000002" }
                name: { type: string, example: "FA Cup" }
                first_tier_bye: { type: integer, minimum: 0, example: 4, description: "N: top tier-1 clubs that join late." }
                survivor_threshold: { type: integer, minimum: 1, example: 8, description: "X: lower clubs remaining when the top N join." }
                prize_pool: { type: number, example: 1000000 }
                scheduling_rules:
                  type: object
                  description: Overrides for matchdays_per_week, days_per_week, kickoff_hours.
      responses:
        "201":
          description: The created cup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cup" }
        "400":
          description: Malformed payload or staged-eligibility conflict (N+X < 2).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: World or country not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Cup name already taken in the country / stage conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/countries/{countryID}/cups/{cupID}/campaign:
    post:
      tags: [admin]
      summary: Start a cup campaign
      operationId: startCupCampaign
      description: |
        Starts the cup's first campaign from the country's league membership:
        lower-tier clubs enter qualifiers, top-N tier-1 clubs seed the late
        entries, and the plan (entrants + full ladder) is persisted for lazy
        bracket draws. Fixtures are scheduled weekly.
      parameters:
        - $ref: "#/components/parameters/WorldID"
        - name: countryID
          in: path
          required: true
          description: Country owning the cup.
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000002" }
        - name: cupID
          in: path
          required: true
          description: Cup id.
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000b" }
      responses:
        "201":
          description: The started season (status in_progress).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Season" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000011
                    competition:
                      id: 00000000-0000-4000-8000-00000000000b
                      name: FA Cup
                    season_label: 2031/32
                    season_number: 1
                    status: in_progress
        "404":
          description: World, country, or cup not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Cup already has a campaign / insufficient entrants / already a cup member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/offers:
    post:
      tags: [admin]
      summary: Create a media/AI job offer
      operationId: createOffer
      description: |
        Offers an AI club to a human manager (used to place the first manager
        into a seeded world before manager self-service exists).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [club_id, manager_id]
              properties:
                club_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000014" }
                manager_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000006" }
      responses:
        "201":
          description: The created offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOffer" }
        "404":
          description: Club or manager not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Club already has a human manager / not an AI club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/club-name-parts:
    get:
      tags: [admin]
      summary: List club name stems and suffixes
      operationId: listClubNameParts
      description: Global pools used by the seeding generator to compose club names.
      responses:
        "200":
          description: The two name-part pools.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stems: { type: array, items: { type: string }, example: [northgate, highfield, eastbrook] }
                  suffixes: { type: array, items: { type: string }, example: [rovers, united, athletic] }
    post:
      tags: [admin]
      summary: Add a club name stem or suffix
      operationId: addClubNamePart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [stem, suffix], example: stem }
                value: { type: string, example: silvermoor }
      responses:
        "201":
          description: The upserted part.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  value: { type: string }
        "400":
          description: Invalid kind or empty value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/club-name-parts/{kind}/{value}:
    delete:
      tags: [admin]
      summary: Delete a club name stem or suffix
      operationId: removeClubNamePart
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [stem, suffix] }
        - name: value
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (deleting an absent entry is a no-op).
        "400":
          description: Invalid kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/countries:
    get:
      tags: [competition]
      summary: Countries in my world
      operationId: myCountries
      responses:
        "200":
          description: Countries declared in the caller's world.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Country" }
  /api/competitions:
    get:
      tags: [competition]
      summary: Competitions in my world
      operationId: myCompetitions
      description: Latest season per competition in the caller's world.
      responses:
        "200":
          description: Competition-season summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/League" }
  /api/competitions/{id}:
    get:
      tags: [competition]
      summary: Competition detail
      operationId: getCompetition
      description: Competition + season (current standings context) in the caller's world.
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
      responses:
        "200":
          description: Competition with season state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/League" }
        "404":
          description: Not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/competitions/{id}/fixtures:
    get:
      tags: [competition]
      summary: Competition fixtures
      operationId: getFixtures
      description: The current season's fixture list in the caller's world, ordered by matchday.
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
      responses:
        "200":
          description: Fixture list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Fixture" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000007
                      world_id: 00000000-0000-4000-8000-000000000001
                      competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                      home_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                      away_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                      matchday: 1
                      scheduled_at: "2026-06-02T18:00:00Z"
                      status: scheduled
  /api/competitions/{id}/calendar:
    get:
      tags: [competition]
      summary: Season fixture calendar
      operationId: getSeasonCalendar
      description: |
        The current season's fixture calendar in the caller's world, grouped
        into game-weeks (IM03). One week spans calendar.days_per_week game-days
        (default 7) and a league plays matchdays_per_week of them (default 3);
        every fixture of a matchday shares one scheduled_at. Pacing follows
        competition_rules.scheduling_rules (matchdays_per_week, days_per_week,
        kickoff_hours), falling back to the world calendar, then defaults.
        An optional season=N resolves that numbered season instead of the
        active one.
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
        - name: season
          in: query
          description: Season number to serve instead of the active season.
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Season calendar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonCalendar" }
              examples:
                sample:
                  value:
                    season: { id: 00000000-0000-4000-8000-00000000000a, label: "2026-27", number: 1, status: in_progress }
                    weeks:
                      - week: 0
                        first_day: "2026-06-01T00:00:00Z"
                        matchdays:
                          - matchday: 1
                            scheduled_at: "2026-06-02T15:00:00Z"
                            fixtures:
                              - id: 00000000-0000-4000-8000-000000000007
                                world_id: 00000000-0000-4000-8000-000000000001
                                competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                                home_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                                away_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                                matchday: 1
                                scheduled_at: "2026-06-02T15:00:00Z"
                                status: scheduled
                          - matchday: 2
                            scheduled_at: "2026-06-04T18:00:00Z"
                            fixtures:
                              - id: 00000000-0000-4000-8000-000000000008
                                world_id: 00000000-0000-4000-8000-000000000001
                                competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                                home_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                                away_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                                matchday: 2
                                scheduled_at: "2026-06-04T18:00:00Z"
                                status: scheduled
        "404":
          description: Competition (or its season) not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/competitions/{id}/standings:
    get:
      tags: [competition]
      summary: Competition standings
      operationId: getStandings
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
      responses:
        "200":
          description: League table for the current season.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Standings" }
              examples:
                sample:
                  value:
                    season: { id: 00000000-0000-4000-8000-00000000000a, label: "2026-27", number: 1, status: active }
                    rows:
                      - { club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }, played: 12, won: 8, drawn: 3, lost: 1, goals_for: 27, goals_against: 9, points: 27 }
                      - { club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }, played: 12, won: 7, drawn: 4, lost: 1, goals_for: 24, goals_against: 11, points: 25 }
  /api/cups:
    get:
      tags: [cup]
      summary: Cups in my world
      operationId: myCups
      description: Every declared domestic cup of the caller's world (IM04).
      responses:
        "200":
          description: Cup list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cup" }
  /api/cups/{id}:
    get:
      tags: [cup]
      summary: Cup campaign view
      operationId: getCup
      description: |
        The cup with its qualification read-back, season, and materialized
        bracket rounds (ties plus byes) once the campaign starts (IM04).
      parameters:
        - name: id
          in: path
          required: true
          description: Cup id.
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000b" }
      responses:
        "200":
          description: Cup campaign.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CupCampaign" }
        "404":
          description: Cup not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/fixtures/{id}:
    get:
      tags: [match]
      summary: Fixture + match header
      operationId: getFixture
      description: The fixture header plus live match view once the match has kicked off (world-scoped to the caller).
      parameters:
        - $ref: "#/components/parameters/FixtureID"
      responses:
        "200":
          description: Fixture with optional live match view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixtureMatch" }
              examples:
                sample:
                  value:
                    fixture:
                      id: 00000000-0000-4000-8000-000000000007
                      world_id: 00000000-0000-4000-8000-000000000001
                      competition: { id: 00000000-0000-4000-8000-00000000000a, name: Premier League }
                      home_club: { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers, short: NGR }
                      away_club: { id: 00000000-0000-4000-8000-000000000014, name: Highfield United, short: HFU }
                      matchday: 1
                      scheduled_at: "2026-06-02T20:00:00Z"
                      status: scheduled
        "404":
          description: Fixture not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/matches/{id}/events:
    get:
      tags: [match]
      summary: Persisted match event feed
      operationId: getMatchEvents
      description: The full ordered match_events feed (the same list the live socket streams), world-scoped.
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: Ordered event feed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MatchEvent" }
              examples:
                sample:
                  value:
                    events:
                      - id: 00000000-0000-4000-8000-000000000015
                        match: { id: 00000000-0000-4000-8000-000000000008 }
                        sequence: 1
                        minute: 1
                        type: MATCH_START
                        detail:
                          home_score: 0
                          away_score: 0
        "404":
          description: Match not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/matches/{id}/tactical:
    post:
      tags: [match]
      summary: Live tactical change
      operationId: liveTacticChange
      description: Switch style or formation while a match is live (one pending change, applied at the next tick).
      parameters:
        - $ref: "#/components/parameters/MatchID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minute: { type: integer, example: 45 }
                style: { type: string, enum: [balanced, counter, attacking, defensive, press, possession], example: attacking }
      responses:
        "200":
          description: Change accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "409":
          description: No live match / change window closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly cookie set by POST /api/auth/login and rotated by /api/auth/refresh.
  parameters:
    WorldID:
      name: id
      in: path
      required: true
      description: World id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000001" }
    ClubID:
      name: id
      in: path
      required: true
      description: Club id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000005" }
    CompetitionID:
      name: id
      in: path
      required: true
      description: Competition id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000a" }
    CupID:
      name: id
      in: path
      required: true
      description: Cup id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000b" }
    LeagueID:
      name: id
      in: path
      required: true
      description: League id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000003" }
    FixtureID:
      name: id
      in: path
      required: true
      description: Fixture id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000007" }
    MatchID:
      name: id
      in: path
      required: true
      description: Match id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000008" }
    OfferID:
      name: id
      in: path
      required: true
      description: Job offer id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000009" }
    AdminCountryID:
      name: countryID
      in: path
      required: true
      description: Country id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000a" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: internal error }
    DashboardItem:
      type: object
      description: |
        One home-feed entry. ID is a stable dedupe key (e.g. "bids:<uuid>",
        "contracts:<uuid>") the client uses to merge realtime
        `dashboard_update` items without refetching.
      required: [id, priority, category, title, description, created_at]
      properties:
        id: { type: string, example: "bids:3b1e..." }
        priority:
          type: string
          enum: [urgent, important, interesting]
        category:
          type: string
          enum: [bids, contracts, match, board, finance, morale, standings, rivals, market]
          example: bids
        title: { type: string, example: "Bid on Jordan Cole for £10,000,000" }
        description: { type: string, example: "Northbridge want your player." }
        created_at: { type: string, format: date-time }
        action:
          $ref: "#/components/schemas/DashboardAction"
    DashboardAction:
      type: object
      description: |
        The deep-link the client follows when the user taps an item. Kind
        selects the screen; the pointed IDs scope it (all optional).
      properties:
        kind:
          type: string
          enum: [respond_bid, renew_contract, set_lineup, view_board, view_finances, view_player, view_standings, view_fixture]
          example: respond_bid
        club_id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        fixture_id: { type: string, format: uuid }
        bid_id: { type: string, format: uuid }
    DashboardSnapshot:
      type: object
      description: "The GET /api/dashboard body: the three ranked feed sections."
      required: [urgent, important, interesting]
      properties:
        urgent:
          type: array
          description: Act now — open bids, expiring contracts, imminent fixtures, critical board confidence, unresolved financial crisis.
          items: { $ref: "#/components/schemas/DashboardItem" }
        important:
          type: array
          description: Decide soon — board-confidence drops, negative cash, unhappy players / transfer requests.
          items: { $ref: "#/components/schemas/DashboardItem" }
        interesting:
          type: array
          description: Ambient context — table position, rival results, market news.
          items: { $ref: "#/components/schemas/DashboardItem" }
    Status:
      type: object
      properties:
        status: { type: string, example: ok }
    Mandate:
      type: object
      description: One structured board target for a (club, manager, season). The club nests as a ref; manager_id stays flat (subject identity).
      properties:
        id: { type: string, format: uuid }
        club: { $ref: "#/components/schemas/ClubRef" }
        manager_id: { type: string, format: uuid }
        season: { type: integer }
        category: { type: string, enum: [primary, secondary, strategic, financial] }
        description: { type: string }
        target_type: { type: string, enum: [league_finish, points_target, wage_structure, operating_balance] }
        target_value: { type: string }
        status: { type: string, enum: [pending, agreed, met, broken] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
    BoardSnapshot:
      type: object
      description: The latest job-security factor snapshot (0-100 each). The club nests as a ref; manager_id stays flat.
      properties:
        manager_id: { type: string, format: uuid }
        club: { $ref: "#/components/schemas/ClubRef" }
        world_tick: { type: integer }
        scores:
          type: object
          properties:
            performance_score: { type: integer }
            expectations_score: { type: integer }
            financial_score: { type: integer }
            board_relationship_score: { type: integer }
            club_dna_alignment_score: { type: integer }
            supporter_sentiment_score: { type: integer }
            alternatives_score: { type: integer }
            total_score: { type: integer }
    BoardView:
      type: object
      description: The board's current view for one manager.
      properties:
        confidence: { type: integer }
        snapshot: { $ref: "#/components/schemas/BoardSnapshot" }
        explanation: { $ref: "#/components/schemas/Explanation" }
        mandates:
          type: array
          items: { $ref: "#/components/schemas/Mandate" }
    NegotiationInput:
      type: object
      required: [target_value]
      properties:
        target_value: { type: string, description: "Bounded numeric target as a string, e.g. \"6\" for finishes or \"62\" for points." }
    NegotiationResult:
      type: object
      properties:
        mandate: { $ref: "#/components/schemas/Mandate" }
        explanation: { $ref: "#/components/schemas/Explanation" }
    SquadMorale:
      type: object
      description: One roster player's morale/role/playing-time read model (S06-03).
      properties:
        player: { $ref: "#/components/schemas/NestedPlayer" }
        first_name: { type: string }
        last_name: { type: string }
        position: { type: string }
        squad_role: { type: string, enum: [key_player, rotation, squad_player, development] }
        morale: { type: number, format: float }
        playing_time_pct: { type: number, format: float, description: Whole-season minutes / (90 x club matches), capped at 1. }
        transfer_request_status: { type: string, nullable: true, enum: [pending, approved, denied, withdrawn, auto_listed, reassured] }
        squad_number: { type: integer, nullable: true }
    PlayerMorale:
      type: object
      description: One player's full morale picture with the "why" (S06-03).
      properties:
        player: { $ref: "#/components/schemas/NestedPlayer" }
        first_name: { type: string }
        last_name: { type: string }
        position: { type: string }
        squad_role: { type: string, enum: [key_player, rotation, squad_player, development] }
        morale: { type: number, format: float }
        playing_time_pct: { type: number, format: float }
        expectations:
          type: array
          items: { $ref: "#/components/schemas/MoraleExpectation" }
        explanation:
          type: object
          additionalProperties: true
        transfer_request: { $ref: "#/components/schemas/TransferRequest" }
        relationship_history:
          type: array
          description: Durable player-manager journal (history only).
          items: { $ref: "#/components/schemas/RelationshipEvent" }
    MoraleExpectation:
      type: object
      description: The agreed role vs the whole-season share and the resulting satisfaction status.
      properties:
        label: { type: string }
        expected: { type: string }
        current: { type: number, format: float }
        status: { type: string, enum: [satisfied, neutral, unhappy, free] }
    RelationshipEvent:
      type: object
      description: One journal row on the player-manager memory.
      properties:
        event_type: { type: string }
        sentiment_delta: { type: integer }
        created_at: { type: string, format: date-time }
    PlayerDevelopment:
      type: object
      description: "One player's observable S08-02 development read model. Trajectory and stored drivers only; the hidden potential ceiling / expansion budget / lock state are never surfaced."
      properties:
        player: { $ref: "#/components/schemas/NestedPlayer" }
        first_name: { type: string }
        last_name: { type: string }
        position: { type: string }
        last_eval_week: { type: integer, format: int64, description: Most recent weekly tick the development pass evaluated this player (0 = never). }
        cum_dev_weeks: { type: integer, description: Cumulative weeks evaluated. }
        consecutive_stagnant_weeks: { type: integer, description: Consecutive weeks below 20% playing-time share. }
        stagnating: { type: boolean, description: True from 4 consecutive stagnant weeks (matches the weekly ×0.85 growth gate). }
        recent_deltas:
          type: array
          description: The eight most recent weekly attribute movements, oldest first; the morale pseudo-key row is excluded.
          items: { $ref: "#/components/schemas/AttributeDelta" }
        drivers:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Explanation" }]
          description: The stored development explanation from the latest DEVELOPMENT_WEEK event, or null when the club has never had a week evaluated.
    AttributeDelta:
      type: object
      description: One weekly net movement of an attribute key (player.player_attribute_changes).
      properties:
        applied_week: { type: integer, format: int64 }
        attribute_key: { type: string }
        delta: { type: integer }
    PlayerInjury:
      type: object
      description: "One player's current injury (S08-03). recovery_progress is derived at read time (elapsed / planned recovery window), never stored; actual_recovery_date is only present once the injury has closed."
      nullable: true
      properties:
        injury_id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        injury_type: { type: string, enum: [muscle, ligament, bone, concussion, illness, recurring] }
        severity: { type: integer, minimum: 1, maximum: 10 }
        occurred_at: { type: string, format: date-time }
        expected_recovery_date: { type: string, format: date-time }
        recurrence_risk: { type: number, format: float, minimum: 0, maximum: 1 }
        recovery_progress: { type: number, format: float, minimum: 0, maximum: 1 }
        days_remaining: { type: integer }
        actual_recovery_date: { type: string, format: date-time, nullable: true }
    WorldChoice:
      type: object
      description: One joined world offered by the login world picker / registration join.
      required: [world_id, name, status]
      properties:
        world_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [provisioning, seeding, active, open_beta, paused, archived] }
    World:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [provisioning, seeding, active, open_beta, paused, archived] }
        created_at: { type: string, format: date-time }
    Country:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    Club:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        name: { type: string }
        short_name: { type: string }
    ClubDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        name: { type: string }
        short_name: { type: string }
        country: { $ref: "#/components/schemas/NestedCountry" }
        is_ai_controlled: { type: boolean }
        manager:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        squad:
          type: array
          items: { $ref: "#/components/schemas/SquadPlayer" }
    SquadPlayer:
      type: object
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        nationality: { $ref: "#/components/schemas/NestedCountry" }
        date_of_birth: { type: string, format: date-time }
        age: { type: integer }
        primary_position: { type: string }
        squad_number: { type: integer, nullable: true }
    Lineup:
      type: object
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        slots:
          type: array
          items:
            type: object
            properties:
              slot: { type: integer }
              position: { type: string }
              player:
                allOf: [{ $ref: "#/components/schemas/NestedPlayer" }]
                nullable: true
                description: Null when the slot is empty.
    Tactics:
      type: object
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        style: { type: string }
        formation: { type: string }
        allowed_formations: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time, nullable: true }
    TrainingPlan:
      type: object
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        archetype: { type: string }
        effective_from_tick: { type: integer }
        last_applied_week: { type: integer, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Academy:
      type: object
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        world_id: { type: string, format: uuid }
        is_active: { type: boolean }
        investment_tier: { type: integer, minimum: 1, maximum: 5 }
        facility_level: { type: integer }
        scouting_level: { type: integer }
        staff_quality: { type: integer }
        annual_cost: { type: integer, format: int64 }
        reputation: { type: integer }
        regional_reach:
          type: array
          items: { type: string }
        last_intake_season: { type: integer, nullable: true }
        shutdown_at: { type: string, format: date-time, nullable: true }
        reopened_at: { type: string, format: date-time, nullable: true }
    MedicalFacility:
      type: object
      description: "A club's medical-staff level 1..10 (S08-03). Clubs without a medical row read as the neutral level 5."
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        level: { type: integer, minimum: 1, maximum: 10 }
        upgraded_at: { type: string, format: date-time, nullable: true, description: Null before the club ever upgrades. }
    SquadDynamics:
      type: object
      description: "Computed dressing-room dynamics (S09-02), derived from the player↔player social graph at read time."
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        action:
          type: string
          enum: [inspect, missed_promise, dropped_from_starting_xi, benched_long_term, wage_cut_offered, contract_approved, transfer_bid_query, transfer_bid_blocked, released_from_squad, training_load_increased, team_talk_motivational, team_talk_critical]
        cohesion: { type: integer, minimum: 10, maximum: 95 }
        manager_support: { type: integer, minimum: 0, maximum: 100 }
        dressing_room_mood: { type: integer, minimum: 0, maximum: 100 }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/SquadTier" }
        factions:
          type: array
          items: { $ref: "#/components/schemas/Faction" }
        contagion:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Contagion" }]
        unrest:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SquadUnrest" }]
        explanation:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Explanation" }]
    SquadTier:
      type: object
      properties:
        player: { $ref: "#/components/schemas/NestedPlayer" }
        tier: { type: string, enum: [team_leader, highly_influential, influential, other] }
    Faction:
      type: object
      properties:
        label: { type: string, enum: [veteran_core, foreign_cohort, youth_alliance, neutral_room] }
        leader: { $ref: "#/components/schemas/NestedPlayer" }
        members:
          type: array
          items: { $ref: "#/components/schemas/NestedPlayer" }
        cohesion: { type: integer, minimum: 10, maximum: 95 }
        explanation: { $ref: "#/components/schemas/Explanation" }
    Contagion:
      type: object
      properties:
        source: { $ref: "#/components/schemas/NestedPlayer" }
        confidence: { type: integer, minimum: 0, maximum: 84 }
        affected:
          type: array
          items: { $ref: "#/components/schemas/NestedPlayer" }
        explanation: { $ref: "#/components/schemas/Explanation" }
    SquadUnrest:
      type: object
      properties:
        severity: { type: integer, minimum: 0, maximum: 100 }
        demand: { type: string, enum: [board_meeting, en_masse_transfer_requests] }
        affected:
          type: array
          items: { $ref: "#/components/schemas/NestedPlayer" }
        explanation: { $ref: "#/components/schemas/Explanation" }
    AcademyUpdateRequest:
      type: object
      properties:
        investment_tier: { type: integer, minimum: 1, maximum: 5 }
        is_active: { type: boolean }
    FinancialSummary:
      type: object
      properties:
        currency: { type: string }
        cash: { type: integer, format: int64 }
        operating_profit: { type: integer, format: int64 }
        transfer_budget: { $ref: "#/components/schemas/BudgetLine" }
        wage_budget: { $ref: "#/components/schemas/BudgetLine" }
        wage_commitments: { $ref: "#/components/schemas/Commitments" }
        committed_spending: { type: integer, format: int64 }
        projected_revenue: { type: integer, format: int64 }
        projected_year_end_balance: { type: integer, format: int64 }
        future_installments: { type: integer, format: int64 }
        debt: { type: integer, format: int64 }
        factors:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { type: integer, format: int64 }
    BudgetLine:
      type: object
      properties:
        season: { type: integer }
        allocated: { type: integer, format: int64 }
        committed: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
    Commitments:
      type: object
      properties:
        count: { type: integer }
        weekly_wage: { type: integer, format: int64 }
        annual_wage: { type: integer, format: int64 }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        entry_type: { type: string, enum: [GENESIS, WAGE, TRANSFER_IN, TRANSFER_OUT, PRIZE, SPONSOR] }
        category: { type: string }
        amount: { type: integer, format: int64 }
        description: { type: string }
        related_event_id: { type: string, format: uuid, nullable: true }
        occurred_at: { type: string, format: date-time }
    Contract:
      type: object
      properties:
        id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        weekly_wage: { type: integer, format: int64 }
        signing_bonus: { type: integer, format: int64 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        release_clause: { type: integer, format: int64, nullable: true }
        status: { type: string }
    FreeAgent:
      type: object
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        nationality_code: { type: string }
        date_of_birth: { type: string, format: date }
        age: { type: integer }
        primary_position: { type: string }
        origin: { type: string, enum: [street, academy] }
        overall_rating: { type: integer }
        market_value: { type: integer, format: int64 }
    FreeAgentList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FreeAgent" }
        total: { type: integer }
    FreeAgentSigningInput:
      type: object
      required: [player_id, weekly_wage, years]
      properties:
        player_id: { type: string, format: uuid }
        weekly_wage: { type: integer, format: int64, example: 45000 }
        years: { type: integer, example: 3 }
    ReleasePlayerInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, example: terminated by manager }
    OkResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
    BulkCreatePlayersInput:
      type: object
      required: [count, age_min, age_max, quality]
      properties:
        count: { type: integer, minimum: 1, maximum: 500, example: 50 }
        age_min: { type: integer, minimum: 13, maximum: 38, example: 17 }
        age_max: { type: integer, minimum: 13, maximum: 38, example: 25 }
        quality: { type: string, enum: [low, mid, high, elite], example: mid }
        positions:
          type: array
          items: { type: string }
          example: ["CM", "ST", "GK"]
        nationality: { type: string, example: NG }
        origin: { type: string, example: generated }
    BulkCreateResult:
      type: object
      properties:
        created: { type: integer, example: 50 }
        player_ids:
          type: array
          items: { type: string, format: uuid }
    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        position: { type: string }
        age: { type: integer }
        market_value: { type: integer, format: int64 }
        listing_club: { $ref: "#/components/schemas/NestedClub" }
        asking_price: { type: integer, format: int64, nullable: true }
        listing_type: { type: string, enum: [open_to_offers, actively_shopped, loan_available] }
        status: { type: string, enum: [active, withdrawn, completed, expired] }
        bid_count: { type: integer }
        latest_bid:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Bid" }]
        listed_at: { type: string, format: date-time }
    ListingList:
      type: object
      properties:
        listings:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
    ListingInput:
      type: object
      required: [player_id]
      properties:
        player_id: { type: string, format: uuid }
        asking_price: { type: integer, format: int64, nullable: true }
        listing_type: { type: string, enum: [open_to_offers, actively_shopped, loan_available], default: open_to_offers }
    TransferTerms:
      type: object
      required: [fee, weekly_wage, contract_length_months]
      properties:
        fee: { type: integer, format: int64, description: Transfer fee (pence). }
        weekly_wage: { type: integer, format: int64 }
        contract_length_months: { type: integer, minimum: 1, maximum: 120 }
        signing_bonus: { type: integer, format: int64 }
        release_clause: { type: integer, format: int64, nullable: true }
        sell_on_percentage: { type: integer, minimum: 0, maximum: 100, nullable: true }
        buy_back_amount: { type: integer, format: int64, nullable: true }
    Bid:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid, nullable: true }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        bidding_club: { $ref: "#/components/schemas/NestedClub" }
        selling_club: { $ref: "#/components/schemas/NestedClub" }
        fee: { type: integer, format: int64 }
        weekly_wage: { type: integer, format: int64 }
        contract_length_months: { type: integer }
        signing_bonus: { type: integer, format: int64 }
        release_clause: { type: integer, format: int64, nullable: true }
        round: { type: integer }
        proposed_by: { type: string, enum: [buying_club, selling_club] }
        status: { type: string, enum: [pending, accepted, rejected, countered, withdrawn, expired] }
        created_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time, nullable: true }
    BidList:
      type: object
      properties:
        incoming:
          type: array
          items: { $ref: "#/components/schemas/Bid" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/Bid" }
    BidInput:
      type: object
      required: [terms]
      properties:
        listing_id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        terms: { $ref: "#/components/schemas/TransferTerms" }
    RespondInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject, counter] }
        terms: { $ref: "#/components/schemas/TransferTerms" }
    Clause:
      type: object
      properties:
        clause_type: { type: string, enum: [sell_on, buy_back] }
        percentage: { type: integer, nullable: true }
        amount: { type: integer, format: int64, nullable: true }
        beneficiary_club: { $ref: "#/components/schemas/NestedClub" }
    CompletedTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        bid_id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        from_club: { $ref: "#/components/schemas/NestedClub" }
        to_club: { $ref: "#/components/schemas/NestedClub" }
        fee: { type: integer, format: int64 }
        clauses:
          type: array
          items: { $ref: "#/components/schemas/Clause" }
        related_event_id: { type: string, format: uuid }
        completed_at: { type: string, format: date-time }
    Explanation:
      type: object
      properties:
        subject: { type: string }
        score: { type: integer }
        factors:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              delta: { type: integer }
    BidResult:
      type: object
      properties:
        bid: { $ref: "#/components/schemas/Bid" }
        transfer:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CompletedTransfer" }]
        explanation:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Explanation" }]
    TransferRequest:
      type: object
      description: A player's open (or resolved) request to leave the club. The manager id stays flat as the subject identity.
      properties:
        id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        club: { $ref: "#/components/schemas/NestedClub" }
        manager: { $ref: "#/components/schemas/NestedManager" }
        reason: { type: string, example: playing_time }
        status: { type: string, enum: [pending, approved, denied, withdrawn, auto_listed, reassured] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        reassured_until: { type: string, format: date-time, nullable: true }

    JobOffer:
      type: object
      description: A pending offer from an AI club to an unemployed manager. The club and manager nest as refs; the recruitment context (board/squad/form/supporters/finance) nests as per-club sibling objects.
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        club: { $ref: "#/components/schemas/ClubRef" }
        manager: { $ref: "#/components/schemas/NestedManager" }
        league: { $ref: "#/components/schemas/OfferLeagueRef" }
        board: { $ref: "#/components/schemas/BoardExpectations" }
        squad: { $ref: "#/components/schemas/SquadOfferSummary" }
        form: { $ref: "#/components/schemas/FormOfferState" }
        supporters: { $ref: "#/components/schemas/SupportersOfferRef" }
        finance: { $ref: "#/components/schemas/FinancialSummary" }
        status: { type: string, enum: [proposed, accepted, declined, expired] }
        created_at: { type: string, format: date-time }
    OfferLeagueRef:
      type: object
      description: "The offered club's domestic league and its current-season table line. Identity is always present (offers are only issued to league clubs); the position and record are omitted until a standings row exists."
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: integer }
        position: { type: integer, description: League table position (1 = top) }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        points: { type: integer }
    BoardExpectations:
      type: object
      description: "Computed board targets for the offered club's current season (a preview; no mandate rows are written for the candidate yet)."
      properties:
        season: { type: integer }
        persona: { type: string }
        mandates:
          type: array
          items: { $ref: "#/components/schemas/OfferBoardMandate" }
    OfferBoardMandate:
      type: object
      properties:
        category: { type: string, enum: [primary, secondary, strategic, financial] }
        description: { type: string }
        target_type: { type: string, enum: [league_finish, points_target, wage_structure, operating_balance] }
        target_value: { type: string }
    SquadOfferSummary:
      type: object
      description: The offered club's senior squad headcount and highest-rated player (position-weighted overall, capped at 99).
      properties:
        size: { type: integer }
        top_player: { $ref: "#/components/schemas/OfferTopPlayer" }
    OfferTopPlayer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: string, enum: [GK, CB, LB, RB, DM, CM, AM, LM, RM, LW, RW, ST] }
        overall: { type: integer }
    FormOfferState:
      type: object
      description: The offered club's recent form streak; present only once the club has played a recorded match.
      properties:
        rating: { type: number }
        form_string: { type: string }
    SupportersOfferRef:
      type: object
      description: The offered club's supporter archetype and current sentiment.
      properties:
        type: { type: string, enum: [prestigious, youth_oriented, local, working_class, international] }
        sentiment: { type: integer }
    ManagerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Ada Lovelace }
        status: { type: string, enum: [active, unemployed, sabbatical, retired] }
        is_policy_bot: { type: boolean }
        active_club: { $ref: "#/components/schemas/ClubRef" }
        career: { $ref: "#/components/schemas/CareerSummary" }
        trophies:
          type: array
          items: { $ref: "#/components/schemas/Trophy" }
        trust_score: { type: integer }
        h2h_vs_viewer: { $ref: "#/components/schemas/H2HRecord" }
        rivalries:
          type: array
          items: { $ref: "#/components/schemas/RivalEdge" }
    InboxMessages:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/InboxMessage" }
        unread: { type: integer, description: Messages not yet read }
    InboxMessage:
      allOf:
        - $ref: "#/components/schemas/Message"
    SendMessageRequest:
      type: object
      required: [recipient_id, body]
      properties:
        recipient_id: { type: string, format: uuid }
        body:
          type: string
          description: Free text, sanitized server-side; max 2000 characters after stripping.
    Message:
      type: object
      description: One direct message on social.messages. Sender/recipient nest as entity refs (a system actor has no id or name).
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        sender: { $ref: "#/components/schemas/EntityRef" }
        recipient: { $ref: "#/components/schemas/EntityRef" }
        subject: { type: string, nullable: true }
        body: { type: string }
        sent_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
    ClubRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        short: { type: string }
        reputation: { type: integer }
        tier: { type: integer }
    Cup:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        country: { $ref: "#/components/schemas/CountryRef" }
        name: { type: string }
        competition_type: { type: string, example: domestic_cup }
        status: { type: string }
        prize_pool: { type: number }
        format: { type: string, example: knockout }
        is_home_and_away: { type: boolean }
        first_tier_bye: { type: integer, description: "N top tier-1 clubs seeded straight into the bracket." }
        survivor_threshold: { type: integer, description: "X qualifier survivors remaining when the top N join." }
    CupCampaign:
      type: object
      description: "The manager cup view (IM04): cup, qualification read-back, season, materialized bracket, champion."
      properties:
        cup: { $ref: "#/components/schemas/Cup" }
        qualification_rules:
          type: object
          description: The persisted campaign plan (entrants + ladder).
        late_entry_round: { type: integer }
        total_rounds: { type: integer }
        season: { $ref: "#/components/schemas/Season" }
        champion: { $ref: "#/components/schemas/ClubRef" }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/CupRound" }
    CupRound:
      type: object
      description: "One materialized knockout round: decided ties plus clubs that advanced on a bye."
      properties:
        round: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        ties:
          type: array
          items: { $ref: "#/components/schemas/CupTie" }
        byes:
          type: array
          items: { $ref: "#/components/schemas/ClubRef" }
    CupTie:
      type: object
      description: One bracket tie — a scheduled fixture with a decided winner once the round completes.
      properties:
        id: { type: string, format: uuid }
        home_club: { $ref: "#/components/schemas/ClubRef" }
        away_club: { $ref: "#/components/schemas/ClubRef" }
        scheduled_at: { type: string, format: date-time }
        status: { type: string }
        home_score: { type: integer, nullable: true }
        away_score: { type: integer, nullable: true }
        winner: { $ref: "#/components/schemas/ClubRef" }
    CareerSummary:
      type: object
      properties:
        matches: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        goals_for: { type: integer }
        goals_against: { type: integer }
    Trophy:
      type: object
      properties:
        season: { type: integer }
        description: { type: string }
        club_name: { type: string }
        won_at: { type: string, format: date-time }
    H2HRecord:
      type: object
      description: Head-to-head from the viewing manager's club perspective.
      properties:
        matches: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        goals_for: { type: integer }
        goals_against: { type: integer }
    RivalEdge:
      type: object
      properties:
        relationship_type: { type: string, example: rivalry }
        entity: { $ref: "#/components/schemas/EntityRef" }
        strength: { type: integer }
        trust: { type: integer }
        sentiment: { type: integer }
    RelationshipEdge:
      type: object
      description: One auto-tracked rivalry edge (club-club or human manager-manager).
      properties:
        relationship_type:
          type: string
          example: rivalry
        entity: { $ref: "#/components/schemas/EntityRef" }
        strength:
          type: integer
          description: Accumulated rivalry strength (clamped to -100..100)
        trust:
          type: integer
          description: Static on rivalry edges; trust lives on the manager's trust_events
        sentiment:
          type: integer
          description: Static on rivalry edges; sentiment lives on the player-manager axis
    Relationships:
      type: object
      properties:
        world_id: { type: string, format: uuid }
        edges:
          type: array
          items: { $ref: "#/components/schemas/RelationshipEdge" }
    NestedClub:
      type: object
      description: Nested club reference on competition/match payloads that join club.clubs.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        short: { type: string }
    NestedCountry:
      type: object
      description: Nested country reference on payloads that join world.countries.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
    NestedCompetition:
      type: object
      description: Nested competition reference on payloads that join competition.competitions.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    NestedLeague:
      type: object
      description: Nested league (competition) reference for adjacency links.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    NestedPlayer:
      type: object
      description: Nested player reference on payloads that join player.players/person.people.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    NestedManager:
      type: object
      description: Nested manager reference on payloads that join manager.managers.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    EntityRef:
      type: object
      description: "Polymorphic graph identity (manager | club | player | system) nested in social payloads. type carries the discriminator; a system actor has neither an id nor a name."
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [manager, club, player, system] }
    NestedMatch:
      type: object
      description: Nested match reference on match payloads.
      properties:
        id: { type: string, format: uuid }
    NestedSeason:
      type: object
      description: Nested season reference on standings payloads.
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        number: { type: integer }
        status: { type: string }
    Season:
      type: object
      description: One league season as returned by the admin start-season endpoint.
      properties:
        id: { type: string, format: uuid }
        competition: { $ref: "#/components/schemas/NestedCompetition" }
        season_label: { type: string }
        season_number: { type: integer }
        status: { type: string }
    League:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        country: { $ref: "#/components/schemas/NestedCountry" }
        name: { type: string }
        tier: { type: integer }
        team_count: { type: integer }
        status: { type: string }
        promotions: { type: integer }
        relegations: { type: integer }
        promotes_to: { $ref: "#/components/schemas/NestedLeague" }
        relegates_to: { $ref: "#/components/schemas/NestedLeague" }
    SeedResult:
      type: object
      properties:
        world_id: { type: string, format: uuid }
        random_seed: { type: integer, format: int64 }
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountrySeed" }
        new_clubs: { type: integer }
        league_count: { type: integer }
    CountrySeed:
      type: object
      properties:
        country_id: { type: string, format: uuid }
        country_name: { type: string }
        leagues:
          type: array
          items: { $ref: "#/components/schemas/LeagueSeed" }
    LeagueSeed:
      type: object
      properties:
        league_id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: integer }
        team_count: { type: integer }
        new_clubs: { type: integer }
        clubs:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    AdminSeedStatus:
      type: object
      properties:
        world_id: { type: string, format: uuid }
        world_seeded: { type: boolean }
        leagues:
          type: object
          properties:
            total: { type: integer }
            seeded: { type: integer }
        clubs: { type: integer }
        pool_size: { type: integer }
        job:
          anyOf:
            - $ref: "#/components/schemas/AdminSeedJobStatus"
            - type: "null"
    AdminSeedJobStatus:
      type: object
      properties:
        id: { type: integer, format: int64 }
        state: { type: string }
        attempt: { type: integer }
        max_attempts: { type: integer }
        attempted_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
    CompetitionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        country_id: { type: string, format: uuid }
        country_name: { type: string }
        tier: { type: integer }
        team_count: { type: integer }
        status: { type: string }
    CompetitionDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        country_id: { type: string, format: uuid }
        country_name: { type: string }
        name: { type: string }
        tier: { type: integer }
        team_count: { type: integer }
        season:
          type: object
          properties:
            season_id: { type: string, format: uuid }
            season_label: { type: string }
            season_number: { type: integer }
            status: { type: string }
    Fixture:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        competition: { $ref: "#/components/schemas/NestedCompetition" }
        home_club: { $ref: "#/components/schemas/NestedClub" }
        away_club: { $ref: "#/components/schemas/NestedClub" }
        matchday: { type: integer }
        gameweek: { type: integer, description: "The fixture's round == matchday. One gameweek is one round, in which each team plays once, mirroring the premier-league gameweek. A club can face several gameweeks within one calendar week (accelerated pacing)." }
        scheduled_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, running, finished] }
        home_score: { type: integer, nullable: true }
        away_score: { type: integer, nullable: true }
    Standings:
      type: object
      properties:
        season: { $ref: "#/components/schemas/NestedSeason" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/StandingRow" }
    StandingRow:
      type: object
      properties:
        club: { $ref: "#/components/schemas/NestedClub" }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        goals_for: { type: integer }
        goals_against: { type: integer }
        points: { type: integer }
    ClubCompetitionItem:
      type: object
      description: "One of the manager's club's competitions (competition.club_competitions membership), as returned by /managers/me/competitions. Exactly one of league | cup is set, discriminated by competition_type."
      properties:
        competition_type: { type: string, enum: [league, domestic_cup] }
        role: { type: string, enum: [league, cup] }
        joined_at: { type: string, format: date-time }
        league: { $ref: "#/components/schemas/ClubLeagueView" }
        cup: { $ref: "#/components/schemas/ClubCupView" }
    ClubLeagueView:
      type: object
      description: "The club's league dossier: full league base, current season, the season's table, and the club's next fixture. season/standings are absent until the league's season starts."
      properties:
        competition: { $ref: "#/components/schemas/League" }
        season: { $ref: "#/components/schemas/NestedSeason" }
        started: { type: boolean, description: True when the league has a current (non-completed) season. }
        standings: { $ref: "#/components/schemas/Standings" }
        next_fixture: { $ref: "#/components/schemas/Fixture" }
    ClubCupView:
      type: object
      description: "The club's cup dossier: full cup base, campaign season, the club's stage and current round, its next fixture in the cup, and the champion once decided."
      properties:
        competition: { $ref: "#/components/schemas/Cup" }
        season: { $ref: "#/components/schemas/NestedSeason" }
        started: { type: boolean, description: True when a campaign season exists. }
        stage:
          type: string
          enum: [not_started, playing, waiting, eliminated]
          description: "not_started: no campaign season yet; playing: next fixture scheduled; waiting: alive but round unmaterialized (e.g. bye); eliminated: out of the cup."
        current_round: { type: integer, description: The round of the club's next fixture, or its highest drawn bracket round when waiting/eliminated. }
        total_rounds: { type: integer }
        next_fixture: { $ref: "#/components/schemas/Fixture" }
        champion: { $ref: "#/components/schemas/ClubRef" }
    NextFixtureView:
      type: object
      description: "GET /clubs/{id}/next-fixture payload: the club's next match across all its competitions (real-world kickoff in fixture.scheduled_at), its gameweek, and a scout report on the opponent."
      properties:
        fixture: { $ref: "#/components/schemas/Fixture" }
        gameweek: { type: integer, description: "The fixture's round (== fixture.matchday): a gameweek is one round, each team plays once." }
        home_or_away: { type: string, enum: [home, away], description: "Whether the scouted club plays at home in this fixture." }
        derby: { type: boolean, description: "True when a club rivalry links the two sides at the derby threshold." }
        derby_intensity: { type: integer }
        golden_goal: { type: boolean, description: "True for knockout ties (golden-goal wins), false for league fixtures." }
        opponent: { $ref: "#/components/schemas/ScoutReport" }
    ScoutReport:
      type: object
      description: "An opponent dossier served to the manager facing them: identity, form, standing, and headline players, all drawn from persisted state."
      properties:
        club: { $ref: "#/components/schemas/ClubRef" }
        country: { $ref: "#/components/schemas/NestedCountry" }
        is_ai_controlled: { type: boolean }
        manager: { $ref: "#/components/schemas/ScoutManagerRef" }
        reputation: { type: integer }
        tier: { type: integer }
        league_position: { type: integer, nullable: true, description: "Opponent's current league-table position; absent when off-season, in no league, or ahead of their first result." }
        form: { $ref: "#/components/schemas/ScoutFormSummary" }
        squad_count: { type: integer }
        top_players:
          type: array
          items: { $ref: "#/components/schemas/ScoutKeyPlayer" }
    ScoutManagerRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        is_policy_bot: { type: boolean }
    ScoutFormSummary:
      type: object
      description: "The opponent's rolling form: trailing-5 results (oldest first, '-'-padded) plus the persisted EWMA rating around 1.0 (neutral)."
      properties:
        form_string: { type: string }
        current_rating: { type: number }
    ScoutKeyPlayer:
      type: object
      description: "One headline opponent player: a position-weighted attribute rating over the position's attack/defence recipe."
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        primary_position: { type: string }
        rating: { type: integer }
    SeasonCalendar:
     type: object
     description: |
       The current season grouped into game-weeks (IM03). week = game-day /
       days_per_week (default 7, world config); a league plays
       matchdays_per_week of them (default 3).
     properties:
       season: { $ref: "#/components/schemas/NestedSeason" }
       weeks:
         type: array
         items: { $ref: "#/components/schemas/FixtureWeek" }
    FixtureWeek:
      type: object
      properties:
        week: { type: integer, description: Zero-based game-week of the season. }
        first_day:
          type: string
          format: date-time
          description: The week's first game-day (the season start plus week × days_per_week).
        matchdays:
          type: array
          items: { $ref: "#/components/schemas/FixtureMatchday" }
    FixtureMatchday:
      type: object
      description: One matchday's fixtures — every fixture shares this scheduled_at. Gameweek is the round (== matchday), the PL-style label for this gameweek.
      properties:
        matchday: { type: integer }
        gameweek: { type: integer, description: "The matchday's round; a team plays once per gameweek." }
        scheduled_at: { type: string, format: date-time, description: Kickoff of the matchday (UTC, from the league's kickoff_hours rotation). }
        fixtures:
          type: array
          items: { $ref: "#/components/schemas/Fixture" }
    FixtureMatch:
      type: object
      properties:
        fixture: { $ref: "#/components/schemas/Fixture" }
        match:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [scheduled, running, finished] }
            minute: { type: integer }
            home_score: { type: integer }
            away_score: { type: integer }
    MatchEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        match: { $ref: "#/components/schemas/NestedMatch" }
        sequence: { type: integer }
        minute: { type: integer }
        type: { type: string, example: MATCH_START }
        club: { $ref: "#/components/schemas/NestedClub" }
        player: { $ref: "#/components/schemas/NestedPlayer" }
        related_player: { $ref: "#/components/schemas/NestedPlayer" }
        detail:
          type: object
          additionalProperties: true
    Policy:
      type: object
      properties:
        world_id: { type: string, format: uuid }
        manager_id: { type: string, format: uuid }
        type: { type: string, enum: [squad, transfer, training] }
        params: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
    AbsenceView:
      type: object
      properties:
        manager_id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        absence_state: { $ref: "#/components/schemas/AbsenceState" }
        clubs:
          type: array
          items: { $ref: "#/components/schemas/ClubRef" }
        next_fixture_at: { type: string, format: date-time, nullable: true }
        delegation_active: { type: boolean }
    AbsenceState:
      type: object
      properties:
        away_since: { type: string, format: date-time, nullable: true }
        away_auto: { type: boolean }
        consecutive_missed: { type: integer }
        last_activity_at: { type: string, format: date-time, nullable: true }
    AbsenceSummary:
      type: object
      properties:
        away: { type: boolean }
        away_auto: { type: boolean }
        away_since: { type: string, format: date-time, nullable: true }
        consecutive_missed: { type: integer }
        active_policies:
          type: array
          items: { type: string }
        next_fixture_at: { type: string, format: date-time, nullable: true }
        delegatable: { type: boolean }
    CountryRef:
      type: object
      required: [id, world_id, code, name]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    PopulationSummary:
      type: object
      properties:
        total: { type: integer }
        active: { type: integer }
        free_agents: { type: integer }
        retired: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
    UnassignedSummary:
      type: object
