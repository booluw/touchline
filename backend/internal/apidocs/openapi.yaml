            application/json:
              schema:
                type: object
                properties:
                  club_id: { type: string, format: uuid }
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/SquadMorale" }
        "403":
          description: No world context for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The manager has no active club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}:
    get:
      tags: [player]
      summary: One player's morale detail
      operationId: getPlayerMorale
      description: "The full morale picture of one of the caller's players with the 'why': role expectations vs the whole-season share, the satisfaction status and pull target, any open transfer request, and the durable player-manager history behind it."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The player's morale detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerMorale" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/development:
    get:
      tags: [player]
      summary: One player's development trajectory
      operationId: getPlayerDevelopment
      description: "The observable S08-02 development picture of one of the caller's players: last evaluated week, cumulative development weeks, consecutive stagnant weeks, a stagnation flag (consecutive threshold 4), the recent weekly attribute movement (excluding the morale pseudo-key) and the drivers recorded on the latest DEVELOPMENT_WEEK event (PRD §54, stored never recomputed). The hidden potential ceiling, expansion budget and lock state are never exposed."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The player's development trajectory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerDevelopment" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/injury:
    get:
      tags: [player]
      summary: One player's open injury
      operationId: getPlayerInjury
      description: "One of the caller's players' current injury (S08-03): type, severity 1..10, expected recovery date, recurrence risk and the read-time derived recovery progress 0..1 plus days remaining. Returns null when the player is fit."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The player's open injury, or null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerInjury" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/rush-return:
    post:
      tags: [player]
      summary: Rush a player back from injury
      operationId: rushPlayerReturn
      description: "Owning manager only (S08-03). Closes the player's open injury immediately, stamping the rushed-return recurrence floor (0.65) and emitting PLAYER_RUSHED_RETURN. The manager gambles a far higher recurrence risk against an immediate return; the risk feeds the player's next injury roll."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The closed injury with actual recovery date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerInjury" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player not found, or no open injury to rush back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/promise-playing-time:
    post:
      tags: [player]
      summary: Promise playing time
      operationId: promisePlayingTime
      description: "Records the manager's explicit increase_playing_time promise to the player. The promise is graded weekly: a share that meets the role entitlement is fulfilled, an overdue one is broken. Stopgap for satisfied-but-anxious players without opening a transfer request."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: Promise recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The manager has no active club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/transfer-request/approve:
    post:
      tags: [player]
      summary: Approve a transfer request
      operationId: approveTransferRequest
      description: "Honors the player's open transfer request: it closes as approved and the player is listed on the market at market value (open to offers). The approval is recorded as a world event and on the player-manager relationship history."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The approved request and the created listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/TransferRequest" }
                  listing: { $ref: "#/components/schemas/Listing" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No open transfer request for this player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Request already resolved, or the listing already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/transfer-request/deny:
    post:
      tags: [player]
      summary: Deny a transfer request
      operationId: denyTransferRequest
      description: "Rejects the player's open request: the player takes a morale hit and cools down before asking again. Recorded on the player-manager relationship history."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The denied request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/TransferRequest" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No open transfer request for this player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Request already resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
