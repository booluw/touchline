        population: { $ref: "#/components/schemas/PopulationSummary" }
        clubs: { $ref: "#/components/schemas/ClubSummary" }
        leagues: { $ref: "#/components/schemas/LeagueSummary" }
        market: { $ref: "#/components/schemas/MarketSummary" }
        economy: { $ref: "#/components/schemas/EconomySummary" }
        unassigned: { $ref: "#/components/schemas/UnassignedSummary" }
        headlines:
          type: array
          items: { $ref: "#/components/schemas/Headline" }
    SeasonRef:
      type: object
      properties:
