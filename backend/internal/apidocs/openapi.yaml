              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the player's club manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player or world not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/listings/{id}:
    get:
      tags: [transfer]
      summary: Listing detail
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000020" }
      responses:
        "200":
          description: The listing with its open bids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404":
          description: Listing not found (or in another world).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/listings/{id}/withdraw:
    post:
      tags: [transfer]
      summary: Withdraw listing
      operationId: withdrawListing
      description: Takes the caller's own active listing off the market and expires its open bids.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000020" }
      responses:
        "200":
          description: The withdrawn listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "403":
          description: Not the listing club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Listing not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/bids:
    get:
      tags: [transfer]
      summary: My bid threads
      operationId: listBids
      description: The negotiation threads the caller's club is involved in, newest first.
      responses:
        "200":
          description: Incoming and outgoing bid threads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidList" }
    post:
      tags: [transfer]
      summary: Place a bid
      operationId: placeBid
      description: Offers on a listed player (via a listing) or directly on any active player. When the selling club is AI the counterpart policy resolves the bid atomically in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidInput" }
      responses:
        "201":
          description: The bid thread, plus the completed transfer and AI explanation when the selling club is AI.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidResult" }
        "400":
          description: Invalid terms, duplicate open bid, or self-bid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player, listing, or world not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Insufficient funds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/bids/{id}/respond:
    post:
      tags: [transfer]
      summary: Respond to a bid
      operationId: respondBid
      description: Accept the other side's current offer, reject it, or put a counter on the table (terms required). An AI counterparty answers a human counter automatically in the same request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000021" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondInput" }
      responses:
        "200":
          description: The updated bid thread, plus the completed transfer and AI explanation when resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidResult" }
        "400":
          description: Invalid action or terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Bid not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Bid already resolved or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/board:
    get:
      tags: [board]
      summary: My club's board status
      operationId: getBoard
      description: The board's confidence in the caller, its factor snapshot and explanation, and the current season's structured mandates. Reading the board refreshes the current-tick snapshot (idempotent).
      responses:
        "200":
          description: The board view for the caller's club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardView" }
        "409":
          description: The manager has no active club to be judged by.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/board/mandates/{id}/negotiate:
    post:
      tags: [board]
      summary: Negotiate a mandate target
      operationId: negotiateMandate
      description: Proposes a bounded new target for one open sporting mandate (league_finish or points_target). Off-window proposals are rejected with 400; the board's own personality decides whether a borderline softening is accepted. Accepted proposals flip the mandate to agreed and are recorded as events.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000021" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NegotiationInput" }
      responses:
        "200":
          description: The updated mandate with the board's explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiationResult" }
        "400":
          description: Off-window proposal or non-negotiable mandate type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the manager's mandate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Mandate not found (or not in this world).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Mandate already resolved or the board rejected the proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/policies/{type}:
    get:
      tags: [policy]
      summary: Get my delegation policy
      operationId: getPolicy
      description: Returns the manager's saved policy for the given type (squad, transfer, or training). 404 if none is saved.
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [squad, transfer, training] }
      responses:
        "200":
          description: The saved policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404":
          description: No policy saved for this type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [policy]
      summary: Save or replace my delegation policy
      operationId: upsertPolicy
      description: Creates or replaces the manager's policy for the given type. A saved policy overrides the assistant default; deleting it restores the default.
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [squad, transfer, training] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params]
              properties:
                params: { type: object }
      responses:
        "200":
          description: The persisted policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400":
          description: Invalid policy type or params.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [policy]
      summary: Delete my delegation policy
      operationId: deletePolicy
      description: Removes a saved policy row; subsequent delegated actions fall back to the assistant default. Deleting an absent row is a no-op (404).
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [squad, transfer, training] }
      responses:
        "204":
          description: Policy deleted.
        "404":
          description: No policy was saved for this type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/absence:
    get:
      tags: [policy]
      summary: My absence state
      operationId: getAbsence
      description: The manager's current away-mode status, associated clubs and the next scheduled fixture. The delegation_active flag is true when the policybot is currently acting on the manager's clubs.
      responses:
        "200":
          description: The absence view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbsenceView" }
    put:
      tags: [policy]
      summary: Toggle explicit away mode
      operationId: setAway
      description: Turns explicit away mode on or off. Toggling on activates delegation immediately and clears the missed-fixture streak. Toggling off reverses delegation until the streak rebuilds. The auto-away flag is always cleared on explicit toggle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [away]
              properties:
                away: { type: boolean }
      responses:
        "204":
          description: Away mode updated.
        "400":
          description: Missing or invalid away payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [policy]
      summary: Clear away mode
      operationId: clearAway
      description: Convenience alias for PUT with away=false.
      responses:
        "204":
          description: Away mode cleared.
  /api/managers/me/absence-summary:
    get:
      tags: [policy]
      summary: Delegation dashboard summary
      operationId: getAbsenceSummary
      description: "Aggregated view of the manager's delegation status: away flags, consecutive missed fixtures, which policy types are active, whether delegation is possible (has at least one club), and the next upcoming fixture."
      responses:
        "200":
          description: The absence summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbsenceSummary" }
