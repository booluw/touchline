openapi: 3.1.0
info:
  title: Touchline API
  version: 0.1.0
  description: |
    Touchline is a text-first football management game. The backend is a single
    binary (`cmd/touchline serve` runs the API, the scheduler world clock, and
    the event worker in one process; the api/scheduler/worker subcommands split
    them for prod isolation).

    Authentication is cookie-based: login exchanges credentials for a rotating
    access/refresh cookie pair, and every game endpoint below a security scheme
    marker requires a valid `access_token` cookie. The whole world is scoped to
    the session, so "my world" reads are always the caller's own world.

    Launch model: worlds are created as metadata (name), then an admin declares
    countries and leagues, and finally seeds the whole world with clubs,
    players, and memberships. Seasons/league play follow the fixture system
    driven by the scheduler.

    The interactive reference is this page; the raw spec lives at
    `/openapi.yaml`. Live game state (world ticks, match pace 15-min ticks)
    streams over `/ws` (see the WebSocket section).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development (cmd/touchline serve)
tags:
  - name: health
    description: Liveness probes (OPD-14 — compose healthchecks depend on these).
  - name: auth
    description: Session lifecycle (login + rotation).
  - name: dashboard
    description: Session-gated dashboard aggregate.
  - name: clubs
    description: Club reads + lineup/tactics/training-plan commands (world-scoped to caller).
  - name: finance
    description: Club finances, ledger, contracts (owning manager only).
  - name: transfer
    description: Transfer market listings, bids, and negotiation (world-scoped).
  - name: board
    description: Board confidence, job security snapshot, and mandate negotiation for the caller's club.
  - name: player
    description: Squad morale detail, playing-time promises, and transfer-request approval for the caller's players.
  - name: manager
    description: The manager's job offer inbox + career actions.
  - name: admin
    description: World lifecycle, whole-world seeding, country/league administration, offer factory, club-name parts. Admin sessions only.
  - name: competition
    description: Competition manager reads (countries, competitions, fixtures, standings), world-scoped.
  - name: match
    description: Match screen fixture header, persisted match event feed, live tactical changes.
  - name: realtime
    description: Authenticated WebSocket push (world ticks, match updates).
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        "200":
          description: Backend process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                ok:
                  value: { status: ok }
  /health/db:
    get:
      tags: [health]
      summary: Database connectivity probe
      operationId: healthDb
      security: []
      responses:
        "200":
          description: PostgreSQL reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                ok:
                  value: { status: db-ok }
        "503":
          description: PostgreSQL unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                down:
                  value: { status: db-down }
  /ws:
    get:
      tags: [realtime]
      summary: Authenticated WebSocket event stream
      operationId: ws
      description: |
        Upgrades to a WebSocket authenticated by the `access_token` cookie on the
        handshake. The server pushes world-scoped events to every socket of that
        world:

        * `world_tick` — `{ event_id, granularity: "daily"|"weekly"|"monthly", tick }`
          broadcast when the scheduler advances the caller's world.
        * `match_update` — live match state updates (`minute`, running score) as the
          worker simulates in-progress matches.

        A HTTP-only cookie is not accessible to the browser WebSocket client
        constructor; Nuxt forwards it automatically because the socket is opened
        same-site. Failing auth closes the handshake with 401.
      security:
        - sessionCookie: []
      responses:
        "101":
          description: WebSocket upgrade accepted; stream begins.
        "401":
          description: Missing/invalid access_token cookie.
  /api/auth/login:
    post:
      tags: [auth]
      summary: Establish a session
      operationId: login
      security: []
      description: |
        Validates credentials and opens a session. An administrator always gets a
        world-less console session. Any other account is resolved per OPD-15(4):

        - the account's active job world wins when it holds one;
        - a jobless account may pass `world_id` to pick a world explicitly (403 if
          it is not a member there);
        - with exactly one joined world the session is minted for that world;
        - with several joined worlds the response is a world PICKER
          `{"status":"worlds","worlds":[...]}` — no cookies are set and the client
          re-posts with the chosen `world_id`;
        - an account with no joined world gets 403 (ErrNoManager).

        The world resolution operates on non-archived memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@touchline.local }
                password: { type: string, format: password, example: changeme }
                world_id:
                  type: string
                  format: uuid
                  description: Explicit world pick for a jobless multi-world account (OPD-15(4)(b)).
                  example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: |
            Either a session (cookies set, `display_name` body) or the world
            picker (`{"status":"worlds","worlds":[...]}`, no cookies).
          headers:
            Set-Cookie:
              description: access_token + refresh_token httpOnly cookies (session outcome only).
              schema: { type: string, example: "access_token=eyJ...; HttpOnly; Path=/; SameSite=Lax; Max-Age=900" }
          content:
            application/json:
              schema:
                oneOf:
                  - title: session
                    type: object
                    properties:
                      display_name: { type: string, example: "Alan Coach" }
                      created_at: { type: string, format: date-time }
                      is_admin: { type: boolean, example: false }
                      id: { type: string, format: uuid }
                  - title: worldPicker
                    type: object
                    required: [status, worlds]
                    properties:
                      status: { type: string, example: worlds }
                      worlds:
                        type: array
                        items: { $ref: "#/components/schemas/WorldChoice" }
        "400":
          description: Malformed body (missing email/password).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "email and password are required" }
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "invalid email or password" }
        "403":
          description: Account is not loggable into any world (ErrNoManager / ErrNotMember).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noWorld:
                  value: { error: "no world joined — an administrator must give this account a world before it can log in" }
                notMember:
                  value: { error: "this account is not a member of the requested world" }
  /api/auth/register:
    post:
      tags: [auth]
      summary: Create a manager account (signup)
      operationId: register
      security: []
      description: |
        Product signup flow (A13). Creates a plain (non-admin) account and — when
        there is EXACTLY one playable world (`active`/`open_beta`) — auto-joins it
        as an unemployed manager and auto-issues a first job offer from the first
        available AI club (deterministic by club id). With zero or several
        playable worlds the account is created world-less (`world: null`) and an
        administrator must join it later. Auto-offer is best-effort: when no AI
        club is available the account is created and `offer` is null. No session
        is minted by registration; the new manager logs in via /api/auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: player@touchline.local }
                password: { type: string, format: password, example: changeme }
                display_name:
                  type: string
                  description: Defaults to the email local part.
                  example: Alan Coach
      responses:
        "201":
          description: Account created (and joined + offered when possible).
          content:
            application/json:
              schema:
                type: object
                required: [id, email, display_name, is_admin, world, offer]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  display_name: { type: string }
                  is_admin: { type: boolean, enum: [false] }
                  world:
                    description: The joined world, or null when no auto-join happened.
                    allOf:
                      - $ref: "#/components/schemas/WorldChoice"
                      - nullable: true
                  offer:
                    description: The auto-issued first job offer, or null.
                    $ref: "#/components/schemas/JobOffer"
              examples:
                joined:
                  value:
                    id: 00000000-0000-4000-8000-000000000100
                    email: player@touchline.local
                    display_name: Alan Coach
                    is_admin: false
                    world:
                      world_id: 00000000-0000-4000-8000-000000000001
                      name: Westland
                      status: active
                    offer:
                      id: 00000000-0000-4000-8000-000000000009
                      world_id: 00000000-0000-4000-8000-000000000001
                      club_id: 00000000-0000-4000-8000-000000000005
                      club_name: Northgate Rovers
                      manager_id: 00000000-0000-4000-8000-000000000101
                      status: proposed
                      created_at: "2026-01-01T00:00:00Z"
                worldless:
                  value:
                    id: 00000000-0000-4000-8000-000000000100
                    email: player@touchline.local
                    display_name: Alan Coach
                    is_admin: false
                    world: null
                    offer: null
        "400":
          description: Malformed body (missing email/password).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "email and password are required" }
        "409":
          description: An account with this email already exists (ErrEmailTaken).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "an account with this email already exists" }
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the session
      operationId: refresh
      security: []
      description: |
        Exchanges the `refresh_token` cookie for a fresh cookie pair for the same
        manager. Used when the access token expires.
      responses:
        "200":
          description: Session rotated; new cookie pair set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "401":
          description: Missing/invalid refresh token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing refresh token" }
  /api/dashboard:
    get:
      tags: [dashboard]
      summary: Session dashboard aggregate
      operationId: dashboard
      description: |
        Protected endpoint proving the session round-trip; the S07-01
        aggregation returns the empty shape the frontend already types against.
      responses:
        "200":
          description: Aggregated dashboard feed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  urgent: { type: array, items: {}, example: [] }
                  important: { type: array, items: {}, example: [] }
                  interesting: { type: array, items: {}, example: [] }
        "401":
          description: No valid access_token cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unauthorized" }
  /api/clubs:
    get:
      tags: [clubs]
      summary: List clubs in my world
      operationId: listClubs
      description: Clubs of the caller's own world (AI clubs included).
      responses:
        "200":
          description: Club list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clubs:
                    type: array
                    items: { $ref: "#/components/schemas/Club" }
              examples:
                sample:
                  value:
                    clubs:
                      - id: 00000000-0000-4000-8000-000000000005
                        world_id: 00000000-0000-4000-8000-000000000001
                        name: Northgate Rovers
                        short_name: NGR
        "403":
          description: Session has no world context (admin console session).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "no world context" }
  /api/clubs/{id}:
    get:
      tags: [clubs]
      summary: Get a club in my world
      operationId: getClub
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Club detail with full squad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubDetail" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000005
                    world_id: 00000000-0000-4000-8000-000000000001
                    name: Northgate Rovers
                    short_name: NGR
                    country: England
                    is_ai_controlled: false
                    manager:
                      id: 00000000-0000-4000-8000-000000000006
                      display_name: Test Manager
                    squad:
                      - id: 00000000-0000-4000-8000-00000000000b
                        person_id: 00000000-0000-4000-8000-00000000000c
                        first_name: Leo
                        last_name: Marsh
                        display_name: Leo Marsh
                        nationality_code: ENG
                        nationality_name: England
                        date_of_birth: "1998-04-12T00:00:00Z"
                        age: 27
                        primary_position: ST
                        squad_number: 9
        "400":
          description: Invalid club id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "invalid club id" }
        "403":
          description: No world context on the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "club not found" }
  /api/clubs/{id}/lineup:
    get:
      tags: [clubs]
      summary: Get the club's lineup
      operationId: getLineup
      description: Slot -> player mapping (16 slots; empty slots null).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The current lineup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineup" }
              examples:
                sample:
                  value:
                    slots:
                      - slot: 0
                        player_id: 00000000-0000-4000-8000-00000000000b
    put:
      tags: [clubs]
      summary: Set the club's lineup
      operationId: setLineup
      description: Submit a full 16-slot lineup. Requires the club's manager identity (or an AI policy bot in scheduled mode).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  minItems: 16
                  maxItems: 16
                  items:
                    type: object
                    required: [slot]
                    properties:
                      slot: { type: integer, example: 0 }
                      player_id: { type: string, format: uuid, nullable: true, example: "00000000-0000-4000-8000-00000000000b" }
      responses:
        "204":
          description: Lineup saved.
        "400":
          description: Invalid lineup (players not in squad, duplicated, wrong count).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthenticated.
        "403":
          description: Not the owning manager of the club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/tactics:
    get:
      tags: [clubs]
      summary: Get the club's tactics
      operationId: getTactics
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Style, formation, allowed formations, and current slot assignments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tactics" }
              examples:
                sample:
                  value:
                    club_id: 00000000-0000-4000-8000-000000000005
                    style: balanced
                    formation: 4-3-3
                    allowed_formations: ["4-3-3", "4-4-2", "3-5-2"]
                    slots:
                      - slot: 0
                        position: GK
                        player_id: 00000000-0000-4000-8000-00000000000b
    post:
      tags: [clubs]
      summary: Set the club's tactics
      operationId: setTactics
      description: Change playing style and/or formation (effect on the existing slot mapping is a bulk re-check by the service).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style, formation]
              properties:
                style: { type: string, enum: [balanced, counter, attacking, defensive, press, possession], example: balanced }
                formation: { type: string, example: "4-3-3" }
      responses:
        "204":
          description: Tactics saved.
        "400":
          description: Invalid formation/style for the squad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/training-plan:
    get:
      tags: [clubs]
      summary: Get the club's training plan
      operationId: getTrainingPlan
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: The club's weekly training archetype.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPlan" }
              examples:
                sample:
                  value:
                    club_id: 00000000-0000-4000-8000-000000000005
                    archetype: balanced
                    effective_from_tick: 62
                    last_applied_week: 7
    post:
      tags: [clubs]
      summary: Set the club's training plan
      operationId: setTrainingPlan
      parameters:
        - $ref: "#/components/parameters/ClubID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archetype]
              properties:
                archetype:
                  type: string
                  enum: [balanced, attacking, defending, fitness, technical]
                  example: balanced
      responses:
        "204":
          description: Training plan saved.
        "400":
          description: Unknown archetype.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/finances:
    get:
      tags: [finance]
      summary: Club financial summary
      operationId: getFinances
      description: Owning manager only (the club resolves the owner's world).
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Cash, budgets, wages, and projections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialSummary" }
              examples:
                sample:
                  value:
                    currency: GBP
                    cash: 48250000
                    operating_profit: 740000
                    transfer_budget: { season: 1, allocated: 30000000, committed: 0, available: 30000000 }
                    wage_budget: { season: 1, allocated: 18000000, committed: 16400000, available: 1600000 }
                    wage_commitments: { count: 24, weekly_wage: 316000, annual_wage: 16400000 }
                    committed_spending: 0
                    projected_revenue: 125000000
                    projected_year_end_balance: 30400000
                    future_installments: 0
                    debt: 0
                    factors:
                      - { label: League position, amount: 18000000 }
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Club not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/ledger:
    get:
      tags: [finance]
      summary: Club ledger entries
      operationId: getLedger
      description: Append-only financial entries (genesis, weekly wages, transfers). Most-recent first.
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Ledger entry list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000010
                      entry_type: GENESIS
                      category: startup_capital
                      amount: 35000000
                      description: Starting cash at club creation
                      occurred_at: "2026-06-01T19:00:00Z"
                    - id: 00000000-0000-4000-8000-000000000011
                      entry_type: WAGE
                      category: wage
                      amount: -1264000
                      description: Weekly wages for 24 players
                      related_event_id: 00000000-0000-4000-8000-000000000012
                      occurred_at: "2026-06-14T19:00:00Z"
        "403":
          description: Not the owning manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/contracts:
    get:
      tags: [finance]
      summary: Club player contracts
      operationId: getContracts
      parameters:
        - $ref: "#/components/parameters/ClubID"
      responses:
        "200":
          description: Active player contracts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contract" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000013
                      player_id: 00000000-0000-4000-8000-00000000000c
                      player_name: Leo Marsh
                      weekly_wage: 45000
                      signing_bonus: 500000
                      start_date: "2026-06-01"
                      end_date: "2028-06-30"
                      release_clause: 25000000
                      status: active
  /api/transfers/listings:
    get:
      tags: [transfer]
      summary: Market listings
      operationId: listListings
      description: Transfer listings in the caller's world, newest first, with open bids attached.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, default: active, enum: [active, withdrawn, completed, expired] }
        - name: position
          in: query
          required: false
          schema: { type: string }
        - name: listing_type
          in: query
          required: false
          schema: { type: string, enum: [open_to_offers, actively_shopped, loan_available] }
        - name: club_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The market's listings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingList" }
    post:
      tags: [transfer]
      summary: List a player
      operationId: createListing
      description: Lists one of the caller's own active players on the market; AI buyer interest settles atomically in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: The created listing with its open bids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400":
          description: Invalid payload, player not transferable, or duplicate listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the player's club manager.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player or world not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/listings/{id}:
    get:
      tags: [transfer]
      summary: Listing detail
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000020" }
      responses:
        "200":
          description: The listing with its open bids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404":
          description: Listing not found (or in another world).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/listings/{id}/withdraw:
    post:
      tags: [transfer]
      summary: Withdraw listing
      operationId: withdrawListing
      description: Takes the caller's own active listing off the market and expires its open bids.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000020" }
      responses:
        "200":
          description: The withdrawn listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "403":
          description: Not the listing club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Listing not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/bids:
    get:
      tags: [transfer]
      summary: My bid threads
      operationId: listBids
      description: The negotiation threads the caller's club is involved in, newest first.
      responses:
        "200":
          description: Incoming and outgoing bid threads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidList" }
    post:
      tags: [transfer]
      summary: Place a bid
      operationId: placeBid
      description: Offers on a listed player (via a listing) or directly on any active player. When the selling club is AI the counterpart policy resolves the bid atomically in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidInput" }
      responses:
        "201":
          description: The bid thread, plus the completed transfer and AI explanation when the selling club is AI.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidResult" }
        "400":
          description: Invalid terms, duplicate open bid, or self-bid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player, listing, or world not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Insufficient funds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/transfers/bids/{id}/respond:
    post:
      tags: [transfer]
      summary: Respond to a bid
      operationId: respondBid
      description: Accept the other side's current offer, reject it, or put a counter on the table (terms required). An AI counterparty answers a human counter automatically in the same request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000021" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondInput" }
      responses:
        "200":
          description: The updated bid thread, plus the completed transfer and AI explanation when resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidResult" }
        "400":
          description: Invalid action or terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Bid not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Bid already resolved or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/board:
    get:
      tags: [board]
      summary: My club's board status
      operationId: getBoard
      description: The board's confidence in the caller, its factor snapshot and explanation, and the current season's structured mandates. Reading the board refreshes the current-tick snapshot (idempotent).
      responses:
        "200":
          description: The board view for the caller's club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardView" }
        "409":
          description: The manager has no active club to be judged by.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/board/mandates/{id}/negotiate:
    post:
      tags: [board]
      summary: Negotiate a mandate target
      operationId: negotiateMandate
      description: Proposes a bounded new target for one open sporting mandate (league_finish or points_target). Off-window proposals are rejected with 400; the board's own personality decides whether a borderline softening is accepted. Accepted proposals flip the mandate to agreed and are recorded as events.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000021" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NegotiationInput" }
      responses:
        "200":
          description: The updated mandate with the board's explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiationResult" }
        "400":
          description: Off-window proposal or non-negotiable mandate type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the manager's mandate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Mandate not found (or not in this world).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Mandate already resolved or the board rejected the proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players:
    get:
      tags: [player]
      summary: My squad's morale and playing time
      operationId: listSquadPlayers
      description: The calling manager's active roster with each player's agreed squad role, morale (0..1), whole-season playing-time share and any open transfer request. World-scoped to the caller's manager; only the owned club is returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
      responses:
        "200":
          description: The club's squad morale overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_id: { type: string, format: uuid }
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/SquadMorale" }
        "403":
          description: No world context for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The manager has no active club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}:
    get:
      tags: [player]
      summary: One player's morale detail
      operationId: getPlayerMorale
      description: "The full morale picture of one of the caller's players with the 'why': role expectations vs the whole-season share, the satisfaction status and pull target, any open transfer request, and the durable player-manager history behind it."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The player's morale detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerMorale" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Player not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/promise-playing-time:
    post:
      tags: [player]
      summary: Promise playing time
      operationId: promisePlayingTime
      description: "Records the manager's explicit increase_playing_time promise to the player. The promise is graded weekly: a share that meets the role entitlement is fulfilled, an overdue one is broken. Stopgap for satisfied-but-anxious players without opening a transfer request."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: Promise recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The manager has no active club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/transfer-request/approve:
    post:
      tags: [player]
      summary: Approve a transfer request
      operationId: approveTransferRequest
      description: "Honors the player's open transfer request: it closes as approved and the player is listed on the market at market value (open to offers). The approval is recorded as a world event and on the player-manager relationship history."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The approved request and the created listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/TransferRequest" }
                  listing: { $ref: "#/components/schemas/Listing" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No open transfer request for this player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Request already resolved, or the listing already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/clubs/{id}/players/{playerID}/transfer-request/deny:
    post:
      tags: [player]
      summary: Deny a transfer request
      operationId: denyTransferRequest
      description: "Rejects the player's open request: the player takes a morale hit and cools down before asking again. Recorded on the player-manager relationship history."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030a" }
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000030b" }
      responses:
        "200":
          description: The denied request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/TransferRequest" }
        "403":
          description: Not the caller's player, or no world context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No open transfer request for this player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Request already resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/managers/me/offers:
    get:
      tags: [manager]
      summary: My job offer inbox
      operationId: listOffers
      description: Open AI-club job offers for the signed-in manager.
      responses:
        "200":
          description: Offer list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/JobOffer" }
              examples:
                sample:
                  value:
                    offers:
                      - id: 00000000-0000-4000-8000-000000000009
                        world_id: 00000000-0000-4000-8000-000000000001
                        club_id: 00000000-0000-4000-8000-000000000014
                        club_name: Highfield United
                        manager_id: 00000000-0000-4000-8000-000000000006
                        status: pending
                        created_at: "2026-06-01T19:00:00Z"
  /api/managers/me/resign:
    post:
      tags: [manager]
      summary: Resign from my club
      operationId: resign
      description: |
        The manager vacates their club (back to AI control). Any open offers
        remain; the manager is once again hirable.
      responses:
        "200":
          description: Resignation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "409":
          description: No club to resign from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/offers/{id}/accept:
    post:
      tags: [manager]
      summary: Accept a job offer
      operationId: acceptOffer
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "200":
          description: The accepted offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOffer" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000009
                    world_id: 00000000-0000-4000-8000-000000000001
                    club_id: 00000000-0000-4000-8000-000000000014
                    club_name: Highfield United
                    manager_id: 00000000-0000-4000-8000-000000000006
                    status: accepted
                    created_at: "2026-06-01T19:00:00Z"
        "404":
          description: Offer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Offer already decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/offers/{id}/decline:
    post:
      tags: [manager]
      summary: Decline a job offer
      operationId: declineOffer
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "200":
          description: The declined offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOffer" }
        "404":
          description: Offer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Offer already decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds:
    post:
      tags: [admin]
      summary: Create a world
      operationId: createWorld
      description: |
        Registers a new world in a provisioning state. A world is then built by
        declaring countries/leagues and seeding (no playable season exists
        until the start-season service runs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Test League World" }
      responses:
        "201":
          description: The created world row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/World" }
              examples:
                sample:
                  value:
                    id: 00000000-0000-4000-8000-000000000001
                    name: Test League World
                    status: provisioning
                    created_at: "2026-06-01T19:00:00Z"
        "409":
          description: A world with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/status:
    post:
      tags: [admin]
      summary: Transition a world's lifecycle status
      operationId: setWorldStatus
      parameters:
        - $ref: "#/components/parameters/WorldID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [provisioning, seeding, active, paused, archived]
                  example: seeding
      responses:
        "200":
          description: Updated world row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/World" }
        "400":
          description: Unknown status / invalid transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/config:
    post:
      tags: [admin]
      summary: Write a world config key
      operationId: setWorldConfig
      parameters:
        - $ref: "#/components/parameters/WorldID"
      description: |
        Sets one world_config key, e.g. a tick cadence (`tick.hourly_cadence`,
        `tick.daily_cadence`, `tick.weekly_cadence`, `tick.monthly_cadence`,
        `tick.seasonal_cadence`; `tick.match_cadence` is seeded but ignored by
        the world clock — see OPD-17(2)). Re-read every `SCHEDULER_POLL_INTERVAL`,
        so a change takes effect without a redeploy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: tick.daily_cadence
                value:
                  type: string
                  description: 5-field cron spec.
                  example: "30 0 * * *"
      responses:
        "200":
          description: Config written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "400":
          description: Missing key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/worlds/{id}/seed:
    post:
      tags: [admin]
      summary: Seed the whole world (clubs, players, memberships)
      operationId: seedWorld
      description: |
        Idempotent, incremental whole-world seeding: every league is filled to
        its team_count with new clubs, players are generated, and club manager
        rows (admin) are migrated to real club ownership. The first successful
        run mints the world's replay random seed. Requires countries+leagues to
        be declared first.
      parameters:
        - $ref: "#/components/parameters/WorldID"
      responses:
        "200":
          description: Seeding summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedResult" }
              examples:
                sample:
                  value:
                    world_id: 00000000-0000-4000-8000-000000000001
                    random_seed: 48765432
                    countries:
                      - country_id: 00000000-0000-4000-8000-000000000002
                        country_name: England
                        leagues:
                          - league_id: 00000000-0000-4000-8000-000000000003
                            name: Premier League
                            tier: 1
                            team_count: 8
                            new_clubs: 8
                            clubs:
                              - { id: 00000000-0000-4000-8000-000000000005, name: Northgate Rovers }
                    new_clubs: 8
                    league_count: 2
        "422":
          description: World has no leagues to seed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "world has no leagues" }
        "404":
          description: World not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/countries:
    get:
      tags: [admin]
      summary: List declared countries
      operationId: listCountries
      responses:
        "200":
          description: Country list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Country" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000002
                      code: ENG
                      name: England
    post:
      tags: [admin]
      summary: Declare a country for the world
      operationId: createCountry
      description: Metadata only — a country holds tiers of leagues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [world_id, code, name]
              properties:
                world_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000001" }
                code: { type: string, example: ENG }
                name: { type: string, example: England }
      responses:
        "201":
          description: The created country.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Country" }
        "400":
          description: Missing fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/leagues:
    get:
      tags: [admin]
      summary: List declared leagues
      operationId: listLeagues
      responses:
        "200":
          description: League list across all declared countries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/League" }
    post:
      tags: [admin]
      summary: Declare a league
      operationId: createLeague
      description: Metadata only — tiers and promotion/relegation rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_id, name, team_count]
              properties:
                country_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000002" }
                name: { type: string, example: "Premier League" }
                tier: { type: integer, minimum: 1, example: 1 }
                team_count: { type: integer, minimum: 4, example: 20 }
                promotions: { type: integer, example: 3 }
                relegations: { type: integer, example: 3 }
                promotes_to: { type: string, format: uuid, nullable: true }
                relegates_to: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: The created league.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/League" }
        "400":
          description: Malformed payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/leagues/{id}/adjacency:
    patch:
      tags: [admin]
      summary: Update a league's promotion/relegation links
      operationId: updateAdjacency
      parameters:
        - $ref: "#/components/parameters/LeagueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promotes_to: { type: string, format: uuid, nullable: true, description: League promoted into above this one. }
                relegates_to: { type: string, format: uuid, nullable: true, description: League relegated into below this one. }
      responses:
        "200":
          description: Updated league.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/League" }
        "400":
          description: Cycles or cross-country adjacency rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: League not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/offers:
    post:
      tags: [admin]
      summary: Create a media/AI job offer
      operationId: createOffer
      description: |
        Offers an AI club to a human manager (used to place the first manager
        into a seeded world before manager self-service exists).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [club_id, manager_id]
              properties:
                club_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000014" }
                manager_id: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000006" }
      responses:
        "201":
          description: The created offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOffer" }
        "404":
          description: Club or manager not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Club already has a human manager / not an AI club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/club-name-parts:
    get:
      tags: [admin]
      summary: List club name stems and suffixes
      operationId: listClubNameParts
      description: Global pools used by the seeding generator to compose club names.
      responses:
        "200":
          description: The two name-part pools.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stems: { type: array, items: { type: string }, example: [northgate, highfield, eastbrook] }
                  suffixes: { type: array, items: { type: string }, example: [rovers, united, athletic] }
    post:
      tags: [admin]
      summary: Add a club name stem or suffix
      operationId: addClubNamePart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [stem, suffix], example: stem }
                value: { type: string, example: silvermoor }
      responses:
        "201":
          description: The upserted part.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  value: { type: string }
        "400":
          description: Invalid kind or empty value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/club-name-parts/{kind}/{value}:
    delete:
      tags: [admin]
      summary: Delete a club name stem or suffix
      operationId: removeClubNamePart
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [stem, suffix] }
        - name: value
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (deleting an absent entry is a no-op).
        "400":
          description: Invalid kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/countries:
    get:
      tags: [competition]
      summary: Countries in my world
      operationId: myCountries
      responses:
        "200":
          description: Countries declared in the caller's world.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Country" }
  /api/competitions:
    get:
      tags: [competition]
      summary: Competitions in my world
      operationId: myCompetitions
      description: Latest season per competition in the caller's world.
      responses:
        "200":
          description: Competition-season summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompetitionSummary" }
  /api/competitions/{id}:
    get:
      tags: [competition]
      summary: Competition detail
      operationId: getCompetition
      description: Competition + season (current standings context) in the caller's world.
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
      responses:
        "200":
          description: Competition with season state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetitionDetail" }
        "404":
          description: Not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/competitions/{id}/fixtures:
    get:
      tags: [competition]
      summary: Competition fixtures
      operationId: getFixtures
      description: The current season's fixture list in the caller's world, ordered by matchday.
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
      responses:
        "200":
          description: Fixture list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Fixture" }
              examples:
                sample:
                  value:
                    - id: 00000000-0000-4000-8000-000000000007
                      world_id: 00000000-0000-4000-8000-000000000001
                      competition_id: 00000000-0000-4000-8000-00000000000a
                      home_club_id: 00000000-0000-4000-8000-000000000005
                      home_club_name: Northgate Rovers
                      away_club_id: 00000000-0000-4000-8000-000000000014
                      away_club_name: Highfield United
                      matchday: 1
                      scheduled_at: "2026-06-07T19:00:00Z"
                      status: scheduled
  /api/competitions/{id}/standings:
    get:
      tags: [competition]
      summary: Competition standings
      operationId: getStandings
      parameters:
        - $ref: "#/components/parameters/CompetitionID"
      responses:
        "200":
          description: League table for the current season.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Standings" }
              examples:
                sample:
                  value:
                    season_id: 00000000-0000-4000-8000-00000000000a
                    season_label: 2026-27
                    season_number: 1
                    status: active
                    rows:
                      - { club_name: Northgate Rovers, club_short: NGR, played: 12, won: 8, drawn: 3, lost: 1, goals_for: 27, goals_against: 9, points: 27 }
                      - { club_name: Highfield United, club_short: HFU, played: 12, won: 7, drawn: 4, lost: 1, goals_for: 24, goals_against: 11, points: 25 }
  /api/fixtures/{id}:
    get:
      tags: [match]
      summary: Fixture + match header
      operationId: getFixture
      description: The fixture header plus live match view once the match has kicked off (world-scoped to the caller).
      parameters:
        - $ref: "#/components/parameters/FixtureID"
      responses:
        "200":
          description: Fixture with optional live match view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixtureMatch" }
              examples:
                sample:
                  value:
                    fixture:
                      id: 00000000-0000-4000-8000-000000000007
                      world_id: 00000000-0000-4000-8000-000000000001
                      competition_id: 00000000-0000-4000-8000-00000000000a
                      home_club_id: 00000000-0000-4000-8000-000000000005
                      home_club_name: Northgate Rovers
                      away_club_id: 00000000-0000-4000-8000-000000000014
                      away_club_name: Highfield United
                      matchday: 1
                      scheduled_at: "2026-06-07T19:00:00Z"
                      status: scheduled
        "404":
          description: Fixture not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/matches/{id}/events:
    get:
      tags: [match]
      summary: Persisted match event feed
      operationId: getMatchEvents
      description: The full ordered match_events feed (the same list the live socket streams), world-scoped.
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: Ordered event feed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MatchEvent" }
              examples:
                sample:
                  value:
                    events:
                      - id: 00000000-0000-4000-8000-000000000015
                        match_id: 00000000-0000-4000-8000-000000000008
                        sequence: 1
                        minute: 1
                        type: MATCH_START
                        data:
                          home_score: 0
                          away_score: 0
        "404":
          description: Match not found in the caller's world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/matches/{id}/tactical:
    post:
      tags: [match]
      summary: Live tactical change
      operationId: liveTacticChange
      description: Switch style or formation while a match is live (one pending change, applied at the next tick).
      parameters:
        - $ref: "#/components/parameters/MatchID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minute: { type: integer, example: 45 }
                style: { type: string, enum: [balanced, counter, attacking, defensive, press, possession], example: attacking }
      responses:
        "200":
          description: Change accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example: { status: ok }
        "409":
          description: No live match / change window closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly cookie set by POST /api/auth/login and rotated by /api/auth/refresh.
  parameters:
    WorldID:
      name: id
      in: path
      required: true
      description: World id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000001" }
    ClubID:
      name: id
      in: path
      required: true
      description: Club id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000005" }
    CompetitionID:
      name: id
      in: path
      required: true
      description: Competition id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-00000000000a" }
    LeagueID:
      name: id
      in: path
      required: true
      description: League id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000003" }
    FixtureID:
      name: id
      in: path
      required: true
      description: Fixture id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000007" }
    MatchID:
      name: id
      in: path
      required: true
      description: Match id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000008" }
    OfferID:
      name: id
      in: path
      required: true
      description: Job offer id.
      schema: { type: string, format: uuid, example: "00000000-0000-4000-8000-000000000009" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: internal error }
    Status:
      type: object
      properties:
        status: { type: string, example: ok }
    Mandate:
      type: object
      description: One structured board target for a (club, manager, season).
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        manager_id: { type: string, format: uuid }
        season: { type: integer }
        category: { type: string, enum: [primary, secondary, strategic, financial] }
        description: { type: string }
        target_type: { type: string, enum: [league_finish, points_target, wage_structure, operating_balance] }
        target_value: { type: string }
        status: { type: string, enum: [pending, agreed, met, broken] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
    BoardSnapshot:
      type: object
      description: The latest job-security factor snapshot (0-100 each).
      properties:
        manager_id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        world_tick: { type: integer }
        scores:
          type: object
          properties:
            performance_score: { type: integer }
            expectations_score: { type: integer }
            financial_score: { type: integer }
            board_relationship_score: { type: integer }
            club_dna_alignment_score: { type: integer }
            supporter_sentiment_score: { type: integer }
            alternatives_score: { type: integer }
            total_score: { type: integer }
    BoardView:
      type: object
      description: The board's current view for one manager.
      properties:
        confidence: { type: integer }
        snapshot: { $ref: "#/components/schemas/BoardSnapshot" }
        explanation: { $ref: "#/components/schemas/Explanation" }
        mandates:
          type: array
          items: { $ref: "#/components/schemas/Mandate" }
    NegotiationInput:
      type: object
      required: [target_value]
      properties:
        target_value: { type: string, description: "Bounded numeric target as a string, e.g. \"6\" for finishes or \"62\" for points." }
    NegotiationResult:
      type: object
      properties:
        mandate: { $ref: "#/components/schemas/Mandate" }
        explanation: { $ref: "#/components/schemas/Explanation" }
    SquadMorale:
      type: object
      description: One roster player's morale/role/playing-time read model (S06-03).
      properties:
        player_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        position: { type: string }
        squad_role: { type: string, enum: [key_player, rotation, squad_player, development] }
        morale: { type: number, format: float }
        playing_time_pct: { type: number, format: float, description: Whole-season minutes / (90 x club matches), capped at 1. }
        transfer_request_status: { type: string, nullable: true, enum: [pending, approved, denied, withdrawn, auto_listed, reassured] }
        squad_number: { type: integer, nullable: true }
    PlayerMorale:
      type: object
      description: One player's full morale picture with the "why" (S06-03).
      properties:
        player_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        position: { type: string }
        squad_role: { type: string, enum: [key_player, rotation, squad_player, development] }
        morale: { type: number, format: float }
        playing_time_pct: { type: number, format: float }
        expectations:
          type: array
          items: { $ref: "#/components/schemas/MoraleExpectation" }
        explanation:
          type: object
          additionalProperties: true
        transfer_request: { $ref: "#/components/schemas/TransferRequest" }
        relationship_history:
          type: array
          description: Durable player-manager journal (history only).
          items: { $ref: "#/components/schemas/RelationshipEvent" }
    MoraleExpectation:
      type: object
      description: The agreed role vs the whole-season share and the resulting satisfaction status.
      properties:
        label: { type: string }
        expected: { type: string }
        current: { type: number, format: float }
        status: { type: string, enum: [satisfied, neutral, unhappy, free] }
    RelationshipEvent:
      type: object
      description: One journal row on the player-manager memory.
      properties:
        event_type: { type: string }
        sentiment_delta: { type: integer }
        created_at: { type: string, format: date-time }
    WorldChoice:
      type: object
      description: One joined world offered by the login world picker / registration join.
      required: [world_id, name, status]
      properties:
        world_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [provisioning, seeding, active, open_beta, paused, archived] }
    World:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [provisioning, seeding, active, open_beta, paused, archived] }
        created_at: { type: string, format: date-time }
    Country:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    Club:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        name: { type: string }
        short_name: { type: string }
    ClubDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        name: { type: string }
        short_name: { type: string }
        country: { type: string }
        is_ai_controlled: { type: boolean }
        manager:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        squad:
          type: array
          items: { $ref: "#/components/schemas/SquadPlayer" }
    SquadPlayer:
      type: object
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        nationality_code: { type: string }
        nationality_name: { type: string }
        date_of_birth: { type: string, format: date-time }
        age: { type: integer }
        primary_position: { type: string }
        squad_number: { type: integer, nullable: true }
    Lineup:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              slot: { type: integer }
              player_id: { type: string, format: uuid, nullable: true }
    Tactics:
      type: object
      properties:
        club_id: { type: string, format: uuid }
        style: { type: string }
        formation: { type: string }
        allowed_formations: { type: array, items: { type: string } }
        slots:
          type: array
          items:
            type: object
            properties:
              slot: { type: integer }
              position: { type: string }
              player_id: { type: string, format: uuid }
    TrainingPlan:
      type: object
      properties:
        club_id: { type: string, format: uuid }
        archetype: { type: string }
        effective_from_tick: { type: integer }
        last_applied_week: { type: integer, nullable: true }
    FinancialSummary:
      type: object
      properties:
        currency: { type: string }
        cash: { type: integer, format: int64 }
        operating_profit: { type: integer, format: int64 }
        transfer_budget: { $ref: "#/components/schemas/BudgetLine" }
        wage_budget: { $ref: "#/components/schemas/BudgetLine" }
        wage_commitments: { $ref: "#/components/schemas/Commitments" }
        committed_spending: { type: integer, format: int64 }
        projected_revenue: { type: integer, format: int64 }
        projected_year_end_balance: { type: integer, format: int64 }
        future_installments: { type: integer, format: int64 }
        debt: { type: integer, format: int64 }
        factors:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { type: integer, format: int64 }
    BudgetLine:
      type: object
      properties:
        season: { type: integer }
        allocated: { type: integer, format: int64 }
        committed: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
    Commitments:
      type: object
      properties:
        count: { type: integer }
        weekly_wage: { type: integer, format: int64 }
        annual_wage: { type: integer, format: int64 }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        entry_type: { type: string, enum: [GENESIS, WAGE, TRANSFER_IN, TRANSFER_OUT, PRIZE, SPONSOR] }
        category: { type: string }
        amount: { type: integer, format: int64 }
        description: { type: string }
        related_event_id: { type: string, format: uuid, nullable: true }
        occurred_at: { type: string, format: date-time }
    Contract:
      type: object
      properties:
        id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        player_name: { type: string }
        weekly_wage: { type: integer, format: int64 }
        signing_bonus: { type: integer, format: int64 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        release_clause: { type: integer, format: int64, nullable: true }
        status: { type: string }
    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        player_name: { type: string }
        position: { type: string }
        age: { type: integer }
        market_value: { type: integer, format: int64 }
        listing_club_id: { type: string, format: uuid }
        listing_club_name: { type: string }
        asking_price: { type: integer, format: int64, nullable: true }
        listing_type: { type: string, enum: [open_to_offers, actively_shopped, loan_available] }
        status: { type: string, enum: [active, withdrawn, completed, expired] }
        bid_count: { type: integer }
        latest_bid:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Bid" }]
        listed_at: { type: string, format: date-time }
    ListingList:
      type: object
      properties:
        listings:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
    ListingInput:
      type: object
      required: [player_id]
      properties:
        player_id: { type: string, format: uuid }
        asking_price: { type: integer, format: int64, nullable: true }
        listing_type: { type: string, enum: [open_to_offers, actively_shopped, loan_available], default: open_to_offers }
    TransferTerms:
      type: object
      required: [fee, weekly_wage, contract_length_months]
      properties:
        fee: { type: integer, format: int64, description: Transfer fee (pence). }
        weekly_wage: { type: integer, format: int64 }
        contract_length_months: { type: integer, minimum: 1, maximum: 120 }
        signing_bonus: { type: integer, format: int64 }
        release_clause: { type: integer, format: int64, nullable: true }
        sell_on_percentage: { type: integer, minimum: 0, maximum: 100, nullable: true }
        buy_back_amount: { type: integer, format: int64, nullable: true }
    Bid:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid, nullable: true }
        player_id: { type: string, format: uuid }
        player_name: { type: string }
        bidding_club_id: { type: string, format: uuid }
        bidding_club_name: { type: string }
        selling_club_id: { type: string, format: uuid }
        selling_club_name: { type: string }
        fee: { type: integer, format: int64 }
        weekly_wage: { type: integer, format: int64 }
        contract_length_months: { type: integer }
        signing_bonus: { type: integer, format: int64 }
        release_clause: { type: integer, format: int64, nullable: true }
        round: { type: integer }
        proposed_by: { type: string, enum: [buying_club, selling_club] }
        status: { type: string, enum: [pending, accepted, rejected, countered, withdrawn, expired] }
        created_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time, nullable: true }
    BidList:
      type: object
      properties:
        incoming:
          type: array
          items: { $ref: "#/components/schemas/Bid" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/Bid" }
    BidInput:
      type: object
      required: [terms]
      properties:
        listing_id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        terms: { $ref: "#/components/schemas/TransferTerms" }
    RespondInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject, counter] }
        terms: { $ref: "#/components/schemas/TransferTerms" }
    Clause:
      type: object
      properties:
        clause_type: { type: string, enum: [sell_on, buy_back] }
        percentage: { type: integer, nullable: true }
        amount: { type: integer, format: int64, nullable: true }
        beneficiary_club_id: { type: string, format: uuid, nullable: true }
    CompletedTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        bid_id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        from_club_id: { type: string, format: uuid }
        to_club_id: { type: string, format: uuid }
        fee: { type: integer, format: int64 }
        clauses:
          type: array
          items: { $ref: "#/components/schemas/Clause" }
        related_event_id: { type: string, format: uuid }
        completed_at: { type: string, format: date-time }
    Explanation:
      type: object
      properties:
        subject: { type: string }
        score: { type: integer }
        factors:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              delta: { type: integer }
    BidResult:
      type: object
      properties:
        bid: { $ref: "#/components/schemas/Bid" }
        transfer:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CompletedTransfer" }]
        explanation:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Explanation" }]
    TransferRequest:
      type: object
      description: A player's open (or resolved) request to leave the club.
      properties:
        id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        manager_id: { type: string, format: uuid }
        reason: { type: string, example: playing_time }
        status: { type: string, enum: [pending, approved, denied, withdrawn, auto_listed, reassured] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        reassured_until: { type: string, format: date-time, nullable: true }

    JobOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        club_name: { type: string }
        manager_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, declined, withdrawn] }
        created_at: { type: string, format: date-time }
    League:
      type: object
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        country_id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: integer }
        team_count: { type: integer }
        status: { type: string }
        promotions: { type: integer }
        relegations: { type: integer }
