# Touchline dev environment.
#
# Postgres is EXTERNAL — a Neon serverless instance, per the technical plan. It is
# deliberately NOT a compose service. Bring your own DATABASE_URL in a repo-root
# `.env` (copy `.env.example`). CI and developers who want a local database use
# `infra/ci/docker-compose.postgres.yml` as an opt-in override — the base file
# stays Postgres-external.
#
# Redis is the only backing store in the compose stack (NATS deferred; river
# chosen as the Phase-0 event bus). Bootstrap order: migrations →
# ref-seed (S01-04 reference data) → touchline (API + scheduler + worker) → frontend.

name: touchline

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: applies pending migrations against Neon before apps boot.
  migrations:
    image: migrate/migrate:v4.18.1
    command: ["-database", "${DATABASE_URL:?DATABASE_URL required (see .env.example / docs/development.md)}", "-path", "/migrations", "up"]
    volumes:
      - ./backend/migrations:/migrations
    restart: "no"

  # One-shot: populates ref.nationalities + ref.name_pool from the curated
  # data/names files. Reference data only — never writes game entities.
  # Runs after migrations; idempotent by construction.
  ref-seed:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ref-seed
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required (see .env.example / docs/development.md)}
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  # One binary, one process: the API (HTTP + WS), the scheduler world clock,
  # and the worker (event consumer + live-match engine) all run together via
  # `touchline serve`. For pod isolation the same image runs a single role with
  # `touchline api|scheduler|worker` instead.
  touchline:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["touchline", "serve"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required (see .env.example / docs/development.md)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required (see .env.example / docs/development.md)}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      API_PORT: "8080"
      ENV: development
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      ref-seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        # Nuxt bakes public runtime config at build time — must be a build arg,
        # not just a runtime env var.
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      touchline:
        condition: service_healthy

volumes:
  redis-data: