# Production stack for Coolify. Postgres stays external (Neon).
# Domains/routing are configured in Coolify, not here.
name: touchline

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrations:
    image: ghcr.io/booluw/migrations:${TAG:-main}
    command: ["-database", "${DATABASE_URL}", "-path", "/migrations", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
    exclude_from_hc: true

  ref-seed:
    image: ghcr.io/booluw/ref-seed:${TAG:-main}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"
    exclude_from_hc: true

  touchline:
    image: ghcr.io/booluw/api:${TAG:-main}
    command: ["touchline", "serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      API_PORT: "8080"
      APP_ORIGIN: https://touchline.myshort.page
      ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      ref-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.touchline-api.rule=Host(`touchline.myshort.page`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/health`))
      - traefik.http.routers.touchline-api.entrypoints=https
      - traefik.http.routers.touchline-api.tls=true
      - traefik.http.routers.touchline-api.tls.certresolver=letsencrypt
      - traefik.http.routers.touchline-api.priority=100
      - traefik.http.services.touchline-api.loadbalancer.server.port=8080

  frontend:
    image: ghcr.io/booluw/frontend:${TAG:-main}
    depends_on:
      touchline:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data: