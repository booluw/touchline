{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "touchline-worker.fullname" . }}
  labels:
    app: {{ include "touchline-worker.name" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "touchline-worker.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: event_bus_queue_depth
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.queueDepthThreshold }}
{{- end }}