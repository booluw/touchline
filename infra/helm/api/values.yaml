replicaCount: 2

image:
  repository: ghcr.io/touchline/api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env:
  API_PORT: "8080"
  ENV: production

# Secrets come from External Secrets Operator / Sealed Secrets (cloud-agnostic).
# Reference the secret names via secretEnvRefs below in an overlay, not hardcoded here.

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

ingress:
  enabled: true
  host: api.touchline.example
  path: /