replicaCount: 2

image:
  repository: ghcr.io/touchline/frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

env:
  NODE_ENV: production
  NUXT_PUBLIC_API_BASE: https://api.touchline.example

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  host: touchline.example
  path: /