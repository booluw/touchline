apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "touchline-migrations.fullname" . }}
  labels:
    app: {{ include "touchline-migrations.name" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "touchline-migrations.fullname" . }}
      labels:
        app: {{ include "touchline-migrations.name" . }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-database"
            - "$(DATABASE_URL)"
            - "-path"
            - "{{ .Values.migrationPath }}"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret.name }}
                  key: {{ .Values.databaseUrlSecret.key }}
          volumeMounts:
            - name: migrations
              mountPath: {{ .Values.migrationPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "touchline-migrations.fullname" . }}-migrations
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}