apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "touchline-migrations.fullname" . }}-migrations
  labels:
    app: {{ include "touchline-migrations.name" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{ (.Files.Glob "files/*.up.sql").AsConfig | nindent 2 }}