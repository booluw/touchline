<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1098" width="680" height="1098" role="img" aria-labelledby="pitch-full-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="pitch-full-title">Full pitch</title>

  <!-- surface -->
  <!-- transparent background — the pitch surface is a separate rect so it can be swapped/omitted -->
  <rect x="4" y="28" width="672" height="1042" fill="#0e1218"/>
  <!-- outer boundary (touchlines + goal lines) -->
  <rect x="4" y="28" width="672" height="1042" fill="none" stroke="#a8b0bb" stroke-width="4"/>

  <!-- halfway line -->
  <line x1="4" y1="549" x2="676" y2="549" stroke="#a8b0bb" stroke-width="3"/>
  <!-- center circle + spot -->
  <circle cx="340" cy="549" r="91.5" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <circle cx="340" cy="549" r="4" fill="#a8b0bb"/>

  <!-- TOP END -->
  <rect x="138.5" y="28" width="403" height="165" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <rect x="248.5" y="28" width="183" height="55" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <circle cx="340" cy="138" r="4" fill="#a8b0bb"/>
  <path d="M 266.9 193 A 91.5 91.5 0 0 0 413.1 193" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <rect x="303.5" y="8" width="73" height="20" fill="none" stroke="#7a8494" stroke-width="3"/>
  <path d="M 14 28 A 10 10 0 0 1 4 38" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <path d="M 666 28 A 10 10 0 0 0 676 38" fill="none" stroke="#a8b0bb" stroke-width="3"/>

  <!-- BOTTOM END -->
  <rect x="138.5" y="905" width="403" height="165" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <rect x="248.5" y="1015" width="183" height="55" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <circle cx="340" cy="960" r="4" fill="#a8b0bb"/>
  <path d="M 266.9 905 A 91.5 91.5 0 0 1 413.1 905" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <rect x="303.5" y="1070" width="73" height="20" fill="none" stroke="#7a8494" stroke-width="3"/>
  <path d="M 14 1070 A 10 10 0 0 0 4 1060" fill="none" stroke="#a8b0bb" stroke-width="3"/>
  <path d="M 666 1070 A 10 10 0 0 1 676 1060" fill="none" stroke="#a8b0bb" stroke-width="3"/>
</svg>
