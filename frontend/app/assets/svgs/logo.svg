<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-labelledby="touchline-logo-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="touchline-logo-title">Touchline</title>

  <!--
    Concept: a football pitch has two touchlines — a thin one and,
    from a broadcast angle, the near one reads bold. The wordmark sits
    between them. The small square marker on the lower line is a
    world-event node sitting on the touchline: this is a persistent,
    event-driven world (WORLD_TICK, PLAYER_SIGNED, ...), and the mark
    is deliberately a square, not a dot — no curves anywhere in this
    mark, consistent with the brutalist radius:0 rule.

    Colors reference the theme tokens directly:
      void-50  #f5f6f8  wordmark
      void-700 #1e252e  top hairline
      cyan-500 #00e8ff  bottom touchline + event node
      void-950 #05070a  node separator stroke
  -->

  <!-- top hairline: the far touchline -->
  <line x1="8" y1="26" x2="632" y2="26" stroke="#1e252e" stroke-width="2"/>

  <!-- wordmark -->
  <text x="320" y="118"
        text-anchor="middle"
        font-family="Barlow Condensed, Arial Narrow, Helvetica Neue Condensed, sans-serif"
        font-weight="700"
        font-size="84"
        letter-spacing="-1"
        fill="#f5f6f8">TOUCHLINE</text>

  <!-- bottom rule: the near touchline -->
  <line x1="8" y1="150" x2="632" y2="150" stroke="#00e8ff" stroke-width="6"/>

  <!-- event node sitting on the touchline -->
  <rect x="466" y="141" width="18" height="18" fill="#00e8ff" stroke="#05070a" stroke-width="2"/>
</svg>