<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="touchline-mark-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="touchline-mark-title">Touchline</title>

  <!--
    Icon-only mark: a broadcast-overlay frame (two opposing corner
    brackets, the way a stat/VAR graphic frames a moment on screen)
    around the same event-node square from the wordmark lockup.
    No curves — consistent with the radius:0 brutalist rule.
  -->

  <!-- top-left bracket -->
  <path d="M10 38 V10 H38" fill="none" stroke="#00e8ff" stroke-width="10"/>
  <!-- bottom-right bracket -->
  <path d="M110 82 V110 H82" fill="none" stroke="#00e8ff" stroke-width="10"/>

  <!-- event node -->
  <rect x="50" y="50" width="20" height="20" fill="#00e8ff" stroke="#05070a" stroke-width="2"/>
</svg>