name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  backend-lint:
    name: Backend lint + vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.57
      - name: Vet
        run: go vet ./...

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test -race ./...

  eventbus-integration:
    name: Integration tests (eventbus, auth, world, manager, api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: touchline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Migrate up
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
          migrate -database "$TEST_DATABASE_URL" -path migrations up
      - name: Integration tests
        # -p 1 serializes packages: the harness truncates a shared database,
        # so concurrent packages would wipe each other's fixtures mid-test.
        run: go test -p 1 -tags integration -race ./pkg/eventbus/... ./internal/auth/... ./internal/world/... ./internal/manager/... ./cmd/api/...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/touchline?sslmode=disable

  frontend-lint:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present

  migrations:
    name: Migrations up/down/re-up
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/touchline?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: touchline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
      - name: Migrate up
        run: migrate -database "$DATABASE_URL" -path backend/migrations up
      - name: Migrate down -all
        run: migrate -database "$DATABASE_URL" -path backend/migrations down -all
      - name: Migrate re-up
        run: migrate -database "$DATABASE_URL" -path backend/migrations up
      - name: Verify version
        run: migrate -database "$DATABASE_URL" -path backend/migrations version
      - name: Seed reference tables (idempotency check)
        working-directory: backend
        run: |
          out1=$(go run ./cmd/ref-seed -database "$DATABASE_URL" -data data/names 2>&1)
          echo "$out1"
          out2=$(go run ./cmd/ref-seed -database "$DATABASE_URL" -data data/names 2>&1)
          echo "$out2"
          grep -q 'ref.nationalities=21 ' <<<"$out1" || { echo "expected 21 nationalities in ref-seed output"; exit 1; }
          [ "$out1" = "$out2" ] || { echo "ref-seed is not idempotent"; exit 1; }

  compose:
    name: Docker Compose contract
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/touchline?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ci-secret
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Boot full stack against containerized Postgres
        run: |
          docker compose -f docker-compose.yml -f infra/ci/docker-compose.postgres.yml up -d --build
          echo "Waiting for the API health check (api /health/db)..."
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/health/db >/dev/null 2>&1; then
              echo "API healthy after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/health/db
          echo
          curl -fsS http://localhost:8080/health
          echo
          docker compose -f docker-compose.yml -f infra/ci/docker-compose.postgres.yml ps
          curl -fsS http://localhost:3000 >/dev/null && echo "frontend responding on :3000"
          docker compose -f docker-compose.yml -f infra/ci/docker-compose.postgres.yml logs --no-color | tail -80
          docker compose -f docker-compose.yml -f infra/ci/docker-compose.postgres.yml down -v

  build-images:
    name: Build + push images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, scheduler, worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}